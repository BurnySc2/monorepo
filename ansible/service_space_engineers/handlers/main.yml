---
- name: Converge space_engineers
  listen: converge space_engineers
  community.docker.docker_compose_v2:
    project_src: "/home/{{ USERNAME }}"
    state: present
    pull: missing
- name: Restart space_engineers
  listen: restart space_engineers
  community.docker.docker_compose_v2:
    project_src: "/home/{{ USERNAME }}"
    state: restarted

---
# Execute with
# ansible-playbook spaceeng_setup.yml -i inventory -i /home/burny/syncthing/secrets/ansible_secrets/.ansible_secrets
- name: Create service [space_engineers]
  hosts: prodesk
  vars:
    USERNAME: "{{ space_engineers_username }}"
    APPLICATION_PORT: "{{ space_engineers_port }}"
  tasks:
    - name: Include tasks [space_engineers]
      ansible.builtin.include_tasks: tasks/space_engineers/main.yml
  handlers:
    - name: Import handlers [space_engineers]
      ansible.builtin.import_tasks: handlers/main.yml

---
# https://gitlab.com/altercode/astroneer-linux
# Execute with
# ansible-playbook astroneer_setup.yml -i inventory -i /home/burny/syncthing/secrets/ansible_secrets/.ansible_secrets
- name: Create service [astroneer]
  hosts: prodesk
  vars:
    USERNAME: "{{ astroneer_username }}"
    APPLICATION_PORT: "{{ astroneer_port }}"
  tasks:
    - name: Include tasks [astroneer]
      ansible.builtin.include_tasks: tasks/astroneer/main.yml
  handlers:
    - name: Import handlers [astroneer]
      ansible.builtin.import_tasks: handlers/main.yml

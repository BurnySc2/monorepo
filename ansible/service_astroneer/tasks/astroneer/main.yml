---
- name: Assert astroneer inventory variables are defined
  ansible.builtin.assert:
    that:
      - astroneer_username is defined
      - astroneer_port is defined
    fail_msg: Missing inventory/host_vars for astroneer_username, astroneer_port

- name: Create group
  ansible.builtin.group:
    name: '{{ astroneer_username }}'
    state: present

- name: Create user
  ansible.builtin.user:
    name: '{{ astroneer_username }}'
    groups:
      - '{{ astroneer_username }}'
      - docker
    shell: '{{ secrets.DEFAULT_SHELL }}'

- name: Get user id
  ansible.builtin.shell:
    cmd: id {{ astroneer_username }} -u
  register: USER_ID
  changed_when: false

- name: Get group id
  ansible.builtin.shell:
    cmd: id {{ astroneer_username }} -g
  register: GROUP_ID
  changed_when: false

- name: Create directories
  ansible.builtin.file:
    path: '{{ item }}'
    recurse: true
    state: directory
    owner: '{{ USER_ID.stdout }}'
    group: '{{ GROUP_ID.stdout }}'
  loop:
    - /home/{{ astroneer_username }}/astroneer

- name: Template Dockerfile file
  ansible.builtin.template:
    src: ../../templates/Dockerfile.j2
    dest: /home/{{ astroneer_username }}/Dockerfile
    owner: '{{ USER_ID.stdout }}'
    group: '{{ GROUP_ID.stdout }}'
    mode: '0640'
  notify: restart astroneer

- name: Template entrypoint.sh file
  ansible.builtin.template:
    src: ../../templates/entrypoint.sh.j2
    dest: /home/{{ astroneer_username }}/entrypoint.sh
    owner: '{{ USER_ID.stdout }}'
    group: '{{ GROUP_ID.stdout }}'
    mode: '0755'
  notify: restart astroneer

- name: Template docker-compose.yml file
  ansible.builtin.template:
    src: ../../templates/docker-compose.yml.j2
    dest: /home/{{ astroneer_username }}/docker-compose.yml
    owner: '{{ USER_ID.stdout }}'
    group: '{{ GROUP_ID.stdout }}'
    mode: '0640'
  notify: restart astroneer

- name: Print reminder if connection issues
  ansible.builtin.debug:
    msg:
      - Each client will have to edit 'Engine.ini' file and add
      - '[SystemSettings]'
      - net.AllowEncryption=False
      - to be able to connect
      - https://gitlab.com/altercode/astroneer-linux/-/issues/1
      - You may copy a savegame to ".../astroneer/Astro/Saved/SaveGames/SAVE_NAME_FROM_ENV"

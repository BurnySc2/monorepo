---
# DEPRECATED
networks:
  pangolin_newt:
    external: true
services:
  broker:
    container_name: paperless-broker
    hostname: paperless-broker
    image: docker.io/library/redis:7-alpine  # WHY 7-alpine: smaller base explicit major
    restart: unless-stopped
    networks:
      - pangolin_newt
    volumes:
      - redisdata:/data
  webserver:
    container_name: paperless-webserver
    image: ghcr.io/paperless-ngx/paperless-ngx:latest  # TODO pin ngx-2.x: WHY latest tracks stable
    restart: unless-stopped
    depends_on:
      - broker
    networks:
      - pangolin_newt
    labels:
      - pangolin.public-resources.paperless.name=Paperless
      - pangolin.public-resources.paperless.full-domain={{ SUBDOMAIN }}.{{ secrets.MY_PUBLIC_DOMAIN }}
      - pangolin.public-resources.paperless.protocol=http
      - pangolin.public-resources.paperless.auth.sso-enabled=true
      - pangolin.public-resources.paperless.targets[0].site=local
      - pangolin.public-resources.paperless.targets[0].method=http
      - pangolin.public-resources.paperless.targets[0].hostname=paperless
      - pangolin.public-resources.paperless.targets[0].port={{ APPLICATION_PORT }}
    healthcheck:
      test:
        - CMD
        - curl
        - -fs
        - -S
        - --max-time
        - '2'
        - http://localhost:8000
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - ./data:/usr/src/paperless/data
      - ./media:/usr/src/paperless/media
      - ./export:/usr/src/paperless/export
      - ./consume:/usr/src/paperless/consume
    env_file: docker-compose.env
    environment:
      PAPERLESS_REDIS: redis://paperless-broker:6379
      PAPERLESS_URL: https://{{ USERNAME }}.{{ secrets.MY_PUBLIC_DOMAIN }}
      PAPERLESS_CSRF_TRUSTED_ORIGINS: https://{{ USERNAME }}.{{ secrets.MY_PUBLIC_DOMAIN }}
      PAPERLESS_CORS_ALLOWED_HOSTS: https://{{ USERNAME }}.{{ secrets.MY_PUBLIC_DOMAIN }}
volumes:
  redisdata: null

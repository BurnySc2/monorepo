---
- name: Ensure pangolin_newt network exists
  ansible.builtin.import_tasks: ../../../tasks/docker/networks.yml

- name: Assert v_rising inventory variables are defined
  ansible.builtin.assert:
    that:
      - v_rising_username is defined
      - v_rising_port is defined
    fail_msg: Missing inventory/host_vars for v_rising_username, v_rising_port

- name: Create group
  ansible.builtin.group:
    name: '{{ v_rising_username }}'
    state: present

- name: Create user
  ansible.builtin.user:
    name: '{{ v_rising_username }}'
    groups:
      - '{{ v_rising_username }}'
      - docker
    shell: '{{ secrets.DEFAULT_SHELL }}'

- name: Get user id
  ansible.builtin.shell:
    cmd: id {{ v_rising_username }} -u
  register: USER_ID
  changed_when: false

- name: Get group id
  ansible.builtin.shell:
    cmd: id {{ v_rising_username }} -g
  register: GROUP_ID
  changed_when: false

- name: Create directories
  ansible.builtin.file:
    path: '{{ item }}'
    recurse: true
    state: directory
    owner: '{{ USER_ID.stdout }}'
    group: '{{ GROUP_ID.stdout }}'
  loop:
    - /home/{{ v_rising_username }}/vrising_saves/Settings

- name: Template ServerHostSettings.json file
  ansible.builtin.template:
    src: ../../templates/ServerHostSettings.json.j2
    dest: /home/{{ v_rising_username }}/vrising_saves/Settings/ServerHostSettings.json
    owner: '{{ USER_ID.stdout }}'
    group: '{{ GROUP_ID.stdout }}'
    mode: '0640'
  notify: restart v_rising

- name: Template docker-compose.yml file
  ansible.builtin.template:
    src: ../../templates/docker-compose.yml.j2
    dest: /home/{{ v_rising_username }}/docker-compose.yml
    owner: '{{ USER_ID.stdout }}'
    group: '{{ GROUP_ID.stdout }}'
    mode: '0640'
  notify: restart v_rising

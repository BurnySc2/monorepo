---
# https://github.com/Didstopia/vrising-server
# Execute with
# ansible-playbook vrising_setup.yml -i inventory -i /home/burny/syncthing/secrets/ansible_secrets/.ansible_secrets
- name: Create service [v_rising]
  hosts: prodesk
  vars:
    USERNAME: "{{ v_rising_username }}"
    APPLICATION_PORT: "{{ v_rising_port }}"
  tasks:
    - ansible.builtin.include_tasks: tasks/v_rising/main.yml
  handlers:
    - ansible.builtin.import_tasks: handlers/main.yml

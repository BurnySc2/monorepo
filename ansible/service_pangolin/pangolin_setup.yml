---
# Execute with
# ansible-playbook pangolin_setup.yml -i inventory -i /home/burny/syncthing/secrets/ansible_secrets/.ansible_secrets
# Secrets stay in templates: PANGOLIN_URL, PANGOLIN.SECRET, TRAEFIK.MY_EMAIL, CLOUDFLARE/MY_PUBLIC_DOMAIN.
# Network converged to literal pangolin_newt via shared guard; legacy secrets.TRAEFIK_NETWORK no longer referenced.
- name: Create service [pangolin]
  hosts: contabo2
  vars:
    USERNAME: "{{ pangolin_username }}"
    SUBDOMAIN: "{{ pangolin_subdomain }}"
  tasks:
    - name: Include tasks [pangolin]
      ansible.builtin.include_tasks: tasks/pangolin/main.yml
  handlers:
    - name: Import handlers [pangolin]
      ansible.builtin.import_tasks: handlers/main.yml

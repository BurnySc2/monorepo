---
# Execute with
# ansible-playbook openchamber_setup.yml -i inventory -i /home/burny/syncthing/secrets/ansible_secrets/.ansible_secrets
- name: Create service [openchamber]
  hosts: prodesk
  vars:
    USERNAME: "{{ openchamber_username }}"
    SUBDOMAIN: "{{ openchamber_subdomain }}"
    APPLICATION_PORT: "{{ openchamber_port }}"
    OPENCHAMBER_UPSTREAM_REF: "{{ openchamber_upstream_ref | default('v2.8.1') }}"
  tasks:
    - name: Include tasks [openchamber]
      ansible.builtin.include_tasks: tasks/openchamber/main.yml
  handlers:
    - name: Import handlers [openchamber]
      ansible.builtin.import_tasks: handlers/main.yml

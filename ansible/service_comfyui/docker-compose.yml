---
networks:
  pangolin_newt:
    external: true
services:
  comfyui:
    container_name: comfyui-cpu
    # build:
    #  context: .
    #  dockerfile: Dockerfile
    image: yanwk/comfyui-boot:cpu-20250630
    # Expose locally, accessible via http://192.168.188.23:8082
    ports:
      - 8082:8188
    volumes:
      - ./storage:/root
    environment:
      - CLI_ARGS=--cpu
    networks:
      - pangolin_newt
    labels:
      - pangolin.public-resources.comfyui.name=Comfyui
      - pangolin.public-resources.comfyui.full-domain={{ SUBDOMAIN }}.{{ secrets.MY_DOMAIN }}
      - pangolin.public-resources.comfyui.protocol=http
      - pangolin.public-resources.comfyui.auth.sso-enabled=false
      - pangolin.public-resources.comfyui.targets[0].site=local
      - pangolin.public-resources.comfyui.targets[0].method=http
      - pangolin.public-resources.comfyui.targets[0].hostname=comfyui
      - pangolin.public-resources.comfyui.targets[0].port={{ APPLICATION_PORT }}

---
# Execute with
# ansible-playbook comfyui_setup.yml -i inventory -i /home/burny/syncthing/secrets/ansible_secrets/.ansible_secrets
- name: Create service [comfyui]
  hosts: prodesk
  vars:
    USERNAME: "{{ comfyui_username }}"
    SUBDOMAIN: "{{ comfyui_subdomain }}"
    APPLICATION_PORT: "{{ comfyui_port }}"
  tasks:
    - name: Include tasks [comfyui]
      ansible.builtin.include_tasks: tasks/comfyui/main.yml
  handlers:
    - name: Import handlers [comfyui]
      ansible.builtin.import_tasks: handlers/main.yml

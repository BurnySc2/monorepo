---
# Execute with
# ansible-playbook rustfs_setup.yml -i ../hosts -i /home/burny/syncthing/secrets/ansible_secrets/.ansible_secrets
- name: Create and start rustfs service
  hosts: server_group4
  vars:
    USERNAME: '{{ secrets.RUSTFS.USERNAME }}'
    SUBDOMAIN: '{{ secrets.RUSTFS.SUBDOMAIN }}'
    ADMINSUBDOMAIN: '{{ secrets.RUSTFS.ADMINSUBDOMAIN }}'
  tasks:
    - include_tasks: ../setup_cloudflare_a_record.yml
      loop:
        - hostname: '{{ SUBDOMAIN }}.{{ secrets.MY_DOMAIN }}'
        - hostname: '{{ ADMINSUBDOMAIN }}.{{ secrets.MY_DOMAIN }}'
      loop_control:
        loop_var: item
      when: "'remote_servers' in group_names"

    - name: Create group
      ansible.builtin.group:
        name: '{{ USERNAME }}'
        state: present

    - name: Create user
      ansible.builtin.user:
        name: '{{ USERNAME }}'
        groups:
          - '{{ USERNAME }}'
          - docker
        shell: '{{ secrets.DEFAULT_SHELL }}'

    - name: docker-compose stop
      community.docker.docker_compose_v2:
        project_src: /home/{{ USERNAME }}
        state: stopped
      failed_when: false

    - name: Copy rustfs docker-compose.yml file
      template:
        src: docker-compose.yml
        dest: /home/{{ USERNAME }}/docker-compose.yml

    - name: Run docker-compose up
      community.docker.docker_compose_v2:
        project_src: /home/{{ USERNAME }}
        pull: always
---
# Execute with
# ansible-playbook rustfs_setup.yml -i ../hosts -i /home/burny/syncthing/secrets/ansible_secrets/.ansible_secrets
- name: Create service [rustfs]
  hosts: server_group4
  vars:
    USERNAME: "{{ rustfs_username }}"
    SUBDOMAIN: "{{ rustfs_subdomain }}"
    ADMINSUBDOMAIN: "{{ rustfs_adminsubdomain }}"
    APPLICATION_PORT: "{{ rustfs_port }}"
    ADMIN_PORT: "{{ rustfs_admin_port }}"
  tasks:
    - ansible.builtin.include_tasks: tasks/rustfs/main.yml
  handlers:
    - ansible.builtin.import_tasks: handlers/main.yml

---
# https://jellyfin.org/
# https://jellyfin.org/docs/general/installation/container/
# https://play.google.com/store/apps/details?id=org.jellyfin.mobile&hl=de
# Execute with
# ansible-playbook jellyfin_setup.yml -i inventory -i /home/burny/syncthing/secrets/ansible_secrets/.ansible_secrets
- name: Create service [jellyfin]
  hosts: burnylaptopd
  vars:
    USERNAME: "{{ jellyfin_username }}"
    SUBDOMAIN: "{{ jellyfin_subdomain }}"
    APPLICATION_PORT: "{{ jellyfin_port }}"
  tasks:
    - name: Include tasks [jellyfin]
      ansible.builtin.include_tasks: tasks/jellyfin/main.yml
  handlers:
    - name: Import handlers [jellyfin]
      ansible.builtin.import_tasks: handlers/main.yml

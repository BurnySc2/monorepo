---
http:
  middlewares:
    cors:
      headers:
        accessControlAllowOriginList:
          - "https://vodching2.burnysc2.xyz"
        accessControlAllowMethods:
          - "GET"
        accessControlAllowHeaders:
          - "Authorization"
        accessControlAllowCredentials: true
        accessControlMaxAge: 86400
  # ======== ROUTERS
  routers:
    # Example for a local service in dynamic.yml file
    cloud:
      entryPoints:
        - web
        - websecure
      rule: Host(`cloud.burnysc2.xyz`)
      service: cloud
      tls:
        certResolver: production
    # Services connected via wireguard clients
    # Server2
    # Jellyfin
    '{{ secrets.JELLYFIN.USERNAME }}':
      entryPoints:
        - web
        - websecure
      rule: Host(`{{ secrets.JELLYFIN.SUBDOMAIN }}.{{ secrets.MY_DOMAIN }}`)
      service: '{{ secrets.JELLYFIN.USERNAME }}'
      tls:
        certResolver: production
      middlewares: 
        - cors
        - authelia@docker
    # Audiobookshelf
    '{{ secrets.AUDIOBOOKSHELF.USERNAME }}':
      entryPoints:
        - web
        - websecure
      rule: Host(`{{ secrets.AUDIOBOOKSHELF.SUBDOMAIN }}.{{ secrets.MY_DOMAIN }}`)
      service: '{{ secrets.AUDIOBOOKSHELF.USERNAME }}'
      tls:
        certResolver: production
      middlewares: authelia@docker
    # Baikal
    '{{ secrets.BAIKAL.USERNAME }}':
      entryPoints:
        - web
        - websecure
      rule: Host(`{{ secrets.BAIKAL.SUBDOMAIN }}.{{ secrets.MY_DOMAIN }}`)
      service: '{{ secrets.BAIKAL.USERNAME }}'
      tls:
        certResolver: production
      middlewares: authelia@docker
    # Trillium
    '{{ secrets.TRILLIUM.USERNAME }}':
      entryPoints:
        - web
        - websecure
      rule: Host(`{{ secrets.TRILLIUM.SUBDOMAIN }}.{{ secrets.MY_DOMAIN }}`)
      service: '{{ secrets.TRILLIUM.USERNAME }}'
      tls:
        certResolver: production
      middlewares: authelia@docker
    # Syncthing
    sync2:
      entryPoints:
        - web
        - websecure
      rule: Host(`sync2.{{ secrets.MY_DOMAIN }}`)
      service: sync2
      tls:
        certResolver: production
      middlewares: authelia@docker
    # Mealie
    mealie:
      entryPoints:
        - web
        - websecure
      rule: Host(`{{ secrets.MEALIE.SUBDOMAIN }}.{{ secrets.MY_DOMAIN }}`)
      service: mealie
      tls:
        certResolver: production
    # Traefik
    traefik2:
      entryPoints:
        - web
        - websecure
      rule: Host(`traefik2.{{ secrets.MY_DOMAIN }}`)
      service: traefik2
      tls:
        certResolver: production
    # Server1
    # Pinchflat
    '{{ secrets.PINCHFLAT.USERNAME }}':
      entryPoints:
        - web
        - websecure
      rule: Host(`{{ secrets.PINCHFLAT.SUBDOMAIN }}.{{ secrets.MY_DOMAIN }}`)
      service: '{{ secrets.PINCHFLAT.USERNAME }}'
      tls:
        certResolver: production
      middlewares: authelia@docker
    # Syncthing
    sync1:
      entryPoints:
        - web
        - websecure
      rule: Host(`sync1.{{ secrets.MY_DOMAIN }}`)
      service: sync1
      tls:
        certResolver: production
      middlewares: authelia@docker
    # Traefik
    traefik1:
      entryPoints:
        - web
        - websecure
      rule: Host(`traefik1.{{ secrets.MY_DOMAIN }}`)
      service: traefik1
      tls:
        certResolver: production
    # Vscode server
    codeserver:
      entryPoints:
        - web
        - websecure
      rule: Host(`{{ secrets.CODESERVER.SUBDOMAIN }}.{{ secrets.MY_DOMAIN }}`)
      service: '{{ secrets.CODESERVER.USERNAME }}'
      tls:
        certResolver: production
      middlewares: authelia@docker
    preview1:
      entryPoints:
        - web
        - websecure
      rule: Host(`{{ secrets.CODESERVER.PREVIEW1 }}.{{ secrets.MY_DOMAIN }}`)
      service: preview1
      tls:
        certResolver: production
      middlewares: authelia@docker
    preview2:
      entryPoints:
        - web
        - websecure
      rule: Host(`{{ secrets.CODESERVER.PREVIEW2 }}.{{ secrets.MY_DOMAIN }}`)
      service: preview1
      tls:
        certResolver: production
      middlewares: authelia@docker
  # ======== SERVICES
  services:
    # Example for a local service in dynamic.yml file
    cloud:
      loadBalancer:
        servers:
          # Both works! service name or host_name
          - url: http://owncloud_server:8080
    # Services connected via wireguard clients
    # Jellyfin
    '{{ secrets.JELLYFIN.USERNAME }}':
      loadBalancer:
        servers:
          # Wireguard client ip and service exposed port to traefik
          - url: '{{ WIREGUARD_URL_BURNYLAPTOPD }}'
    # Audiobookshelf
    '{{ secrets.AUDIOBOOKSHELF.USERNAME }}':
      loadBalancer:
        servers:
          - url: '{{ WIREGUARD_URL_BURNYLAPTOPD }}'
    # Baikal
    '{{ secrets.BAIKAL.USERNAME }}':
      loadBalancer:
        servers:
          - url: '{{ WIREGUARD_URL_BURNYLAPTOPD }}'
    # Trillium
    '{{ secrets.TRILLIUM.USERNAME }}':
      loadBalancer:
        servers:
          - url: '{{ WIREGUARD_URL_BURNYLAPTOPD }}'
    # Syncthing
    sync2:
      loadBalancer:
        servers:
          - url: '{{ WIREGUARD_URL_BURNYLAPTOPD }}'
    # Traefik
    traefik2:
      loadBalancer:
        servers:
          - url: '{{ WIREGUARD_URL_BURNYLAPTOPD }}'
    # Mealie
    mealie:
      loadBalancer:
        servers:
          - url: '{{ WIREGUARD_URL_BURNYLAPTOPD }}'
    # Pinchflat
    '{{ secrets.PINCHFLAT.USERNAME }}':
      loadBalancer:
        servers:
          - url: '{{ WIREGUARD_URL_PRODESK }}'
    # Syncthing
    sync1:
      loadBalancer:
        servers:
          - url: '{{ WIREGUARD_URL_PRODESK }}'
    # Traefik
    traefik1:
      loadBalancer:
        servers:
          - url: '{{ WIREGUARD_URL_PRODESK }}'
    # code-server and 2 preview ports
    codeserver:
      loadBalancer:
        servers:
          - url: '{{ WIREGUARD_URL_PRODESK }}'
    preview1:
      loadBalancer:
        servers:
          - url: '{{ WIREGUARD_URL_PRODESK }}'
    preview2:
      loadBalancer:
        servers:
          - url: '{{ WIREGUARD_URL_PRODESK }}'

---
- name: Create service [excalidraw]
  hosts: server_group4
  vars:
    USERNAME: "{{ excalidraw_username }}"
    SUBDOMAIN: "{{ excalidraw_subdomain }}"
    APPLICATION_PORT: "{{ excalidraw_port }}"
  tasks:
    - name: Include tasks [excalidraw]
      ansible.builtin.include_tasks: tasks/excalidraw/main.yml
  handlers:
    - name: Import handlers [excalidraw]
      ansible.builtin.import_tasks: handlers/main.yml

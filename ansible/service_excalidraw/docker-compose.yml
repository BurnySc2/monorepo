---
# Excalidraw - Self-hosted whiteboard tool
# https://hub.docker.com/r/excalidraw/excalidraw
# https://docs.excalidraw.com/docs/introduction/development
# No external database needed - uses local storage for exports
networks:
  pangolin_newt:
    external: true
services:
  excalidraw:
    # https://hub.docker.com/r/excalidraw/excalidraw/tags
    image: excalidraw/excalidraw:latest
    container_name: excalidraw_docker
    hostname: excalidraw_docker
    networks:
      - pangolin_newt
    restart: unless-stopped
    labels:
      - pangolin.public-resources.excalidraw.name=Excalidraw
      - pangolin.public-resources.excalidraw.full-domain={{ SUBDOMAIN }}.{{ secrets.MY_DOMAIN }}
      - pangolin.public-resources.excalidraw.protocol=http
      - pangolin.public-resources.excalidraw.auth.sso-enabled=true
      - pangolin.public-resources.excalidraw.targets[0].site=local
      - pangolin.public-resources.excalidraw.targets[0].method=http
      - pangolin.public-resources.excalidraw.targets[0].hostname=excalidraw_docker
      - pangolin.public-resources.excalidraw.targets[0].port={{ APPLICATION_PORT }}
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://localhost:8080
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - ./data:/var/app/public/files
---
- name: Assert excalidraw inventory variables are defined
  ansible.builtin.assert:
    that:
      - excalidraw_username is defined
      - excalidraw_subdomain is defined
      - excalidraw_port is defined
    fail_msg: Missing inventory/host_vars for excalidraw_username, excalidraw_subdomain, excalidraw_port

- name: Ensure A record exists
  ansible.builtin.include_tasks: ../../../setup_cloudflare_a_record.yml
  loop:
    - {domain: '{{ secrets.MY_PUBLIC_DOMAIN }}', subdomain: '{{ excalidraw_subdomain }}'}

- name: Create group
  ansible.builtin.group:
    name: '{{ excalidraw_username }}'
    state: present

- name: Create user
  ansible.builtin.user:
    name: '{{ excalidraw_username }}'
    groups:
      - '{{ excalidraw_username }}'
      - docker
    shell: '{{ secrets.DEFAULT_SHELL }}'

- name: Get user id
  ansible.builtin.shell:
    cmd: id {{ excalidraw_username }} -u
  register: USER_ID
  changed_when: false

- name: Get group id
  ansible.builtin.shell:
    cmd: id {{ excalidraw_username }} -g
  register: GROUP_ID
  changed_when: false

- name: Create directories
  ansible.builtin.file:
    path: '{{ item }}'
    recurse: true
    state: directory
    owner: '{{ USER_ID.stdout }}'
    group: '{{ GROUP_ID.stdout }}'
  loop:
    - /home/{{ excalidraw_username }}/data

- name: Template docker-compose.yml file
  ansible.builtin.template:
    src: ../../templates/docker-compose.yml.j2
    dest: /home/{{ excalidraw_username }}/docker-compose.yml
    owner: '{{ USER_ID.stdout }}'
    group: '{{ GROUP_ID.stdout }}'
    mode: '0640'
  notify: restart excalidraw

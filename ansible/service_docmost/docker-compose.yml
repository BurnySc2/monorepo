---
networks:
  pangolin_newt:
    external: true
  docmost-net:
    driver: bridge
services:
  docmost:
    image: docmost/docmost:latest
    depends_on:
      - db
      - redis
    environment:
      APP_URL: https://{{ secrets.DOCMOST.SUBDOMAIN }}.{{ secrets.MY_DOMAIN }}
      APP_SECRET: '{{ secrets.DOCMOST.APP_SECRET }}'
      DATABASE_URL: postgresql://docmost:STRONG_DB_PASSWORD@db:5432/docmost?schema=public
      REDIS_URL: redis://redis:6379
    restart: unless-stopped
    volumes:
      - ./docmost:/app/data/storage
    networks:
      - pangolin_newt
      - docmost-net
    labels:
      - pangolin.public-resources.docmost.name=Docmost
      - pangolin.public-resources.docmost.full-domain={{ SUBDOMAIN }}.{{ secrets.MY_DOMAIN }}
      - pangolin.public-resources.docmost.protocol=http
      - pangolin.public-resources.docmost.auth.sso-enabled=false
      - pangolin.public-resources.docmost.targets[0].site=local
      - pangolin.public-resources.docmost.targets[0].method=http
      - pangolin.public-resources.docmost.targets[0].port={{ APPLICATION_PORT }}
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: STRONG_DB_PASSWORD
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - docmost-net
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - docmost-net
volumes:
  docmost: null
  db_data: null
  redis_data: null

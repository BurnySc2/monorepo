---
# https://docmost.com/docs/
# Execute with
# ansible-playbook docmost_setup.yml -i inventory -i /home/burny/syncthing/secrets/ansible_secrets/.ansible_secrets
- name: Create service
  hosts: server_group4
  vars:
    USERNAME: "{{ docmost_username }}"
    SUBDOMAIN: "{{ docmost_subdomain }}"
    APPLICATION_PORT: "{{ docmost_port }}"
  tasks:
    - ansible.builtin.include_tasks: tasks/docmost/main.yml
  handlers:
    - ansible.builtin.import_tasks: handlers/main.yml

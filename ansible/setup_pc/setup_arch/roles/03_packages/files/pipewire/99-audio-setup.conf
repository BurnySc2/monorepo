context.modules = [
  # --- 1. Clean Mic (RNNoise) ---
  { name = libpipewire-module-filter-chain
    flags = [ ifexists nofail ]
    args = {
      node.description = "Clean Mic (RNNoise)"
      media.name       = "Clean Mic (RNNoise)"
      filter.graph = {
        nodes = [
          {
            type   = ladspa
            name   = rnnoise
            plugin = /usr/lib/ladspa/librnnoise_ladspa.so
            label  = noise_suppressor_mono
            control = {
              "VAD Threshold (%)" = 50.0
            }
          }
        ]
      }
      capture.props = {
        node.name      = "capture.rnnoise_source"
        node.passive   = true
        audio.rate     = 48000
      }
      playback.props = {
        node.name      = "rnnoise_source"
        media.class    = Audio/Source
        audio.rate     = 48000
      }
    }
  }

  # --- 2. Mic to Combined Loopback ---
  { name = libpipewire-module-loopback
    flags = [ ifexists nofail ]
    args = {
      capture.props = {
        node.name         = "loopback.mic_to_combined"
        node.description  = "Mic to Combined Capture"
        media.name        = "Mic to Combined Capture"
        node.nick         = "Mic to Combined"
        node.passive      = true
        audio.position    = [ FL FR ]
        target.object     = "rnnoise_source"
      }
      playback.props = {
        node.name         = "loopback.mic_to_combined_playback"
        node.description  = "Mic to Combined Playback"
        media.name        = "Mic to Combined Playback"
        node.nick         = "Mic to Combined Playback"
        audio.position    = [ FL FR ]
        target.object     = "Combined_Mic_Piano"
      }
    }
  }

  # --- 3. Piano to Combined Loopback ---
  { name = libpipewire-module-loopback
    flags = [ ifexists nofail ]
    args = {
      capture.props = {
        node.name         = "loopback.piano_to_combined"
        node.description  = "Piano to Combined Capture"
        media.name        = "Piano to Combined Capture"
        node.nick         = "Piano to Combined"
        node.passive      = true
        audio.position    = [ FL FR ]
        target.object     = "alsa_input.pci-0000_0a_00.6.analog-stereo"
      }
      playback.props = {
        node.name         = "loopback.piano_to_combined_playback"
        node.description  = "Piano to Combined Playback"
        media.name        = "Piano to Combined Playback"
        node.nick         = "Piano to Combined Playback"
        audio.position    = [ FL FR ]
        target.object     = "Combined_Mic_Piano"
      }
    }
  }

  # --- 4. Twitch Loopback ---
  { name = libpipewire-module-loopback
    flags = [ ifexists nofail ]
    args = {
      capture.props = {
        node.name         = "loopback.twitch_sink"
        node.description  = "Twitch Loopback Capture"
        media.name        = "Twitch Loopback Capture"
        node.nick         = "Twitch Capture"
        audio.position    = [ FL FR ]
        media.source.name = "Twitch_Sink.monitor"
      }
      playback.props = {
        node.name         = "loopback.twitch_playback"
        node.description  = "Twitch Loopback Playback"
        media.name        = "Twitch Loopback Playback"
        node.nick         = "Twitch Playback"
        audio.position    = [ FL FR ]
      }
    }
  }

  # --- 5. TwitchNoVod Loopback ---
  { name = libpipewire-module-loopback
    flags = [ ifexists nofail ]
    args = {
      capture.props = {
        node.name         = "loopback.twitchnovod_sink"
        node.description  = "TwitchNoVod Loopback Capture"
        media.name        = "TwitchNoVod Loopback Capture"
        node.nick         = "TwitchNoVod Capture"
        audio.position    = [ FL FR ]
        media.source.name = "TwitchNoVod_Sink.monitor"
      }
      playback.props = {
        node.name         = "loopback.twitchnovod_playback"
        node.description  = "TwitchNoVod Loopback Playback"
        media.name        = "TwitchNoVod Loopback Playback"
        node.nick         = "TwitchNoVod Playback"
        audio.position    = [ FL FR ]
      }
    }
  }
]

context.objects = [
  { factory = adapter
    args = {
      factory.name = support.null-audio-sink
      node.name = "Combined_Mic_Piano"
      node.description = "Combined Mic + E-Piano"
      media.class = "Audio/Source/Virtual"
      node.virtual = true
      audio.position = [ FL FR ]
    }
  }
  { factory = adapter
    flags = [ ifexists nofail ]
    args = {
      factory.name = support.null-audio-sink
      node.name = "Twitch_Sink"
      node.description = "Twitch_Sink"
      media.class = "Audio/Sink"
      audio.position = [ FL FR ]
    }
  }
  { factory = adapter
    flags = [ ifexists nofail ]
    args = {
      factory.name = support.null-audio-sink
      node.name = "TwitchNoVod_Sink"
      node.description = "TwitchNoVod_Sink"
      media.class = "Audio/Sink"
      audio.position = [ FL FR ]
    }
  }
]

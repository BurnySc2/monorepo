# Low-latency: 128/48k = 2.67ms. If crackle/xruns (pw-top BUSY spikes, journal xrun/underrun):
# 1. quantum 128 -> 256 (5.33ms), then 512 (10.7ms) if still bad
# 2. keep min-quantum = quantum (prevents dips to 64=1.33ms)
# 3. keep max-quantum 512-1024 for background headroom
# 4. check rtkit + performance governor, WAIT spikes = scheduling not DSP
# Verify: pw-top while talking+playing, journalctl --user -u pipewire | grep -i xrun
context.properties = {
  default.clock.rate = 48000
  default.allowed-rates = [ 48000 ]
  default.clock.quantum = 128
  default.clock.min-quantum = 128
  default.clock.max-quantum = 512
}
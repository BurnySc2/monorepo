---
- name: Install packages
  community.general.pacman:
    name:
      # i3wm related software
      - i3-wm
      - i3status
      - i3blocks
      - i3exit
      - rofi  # dmenu alternative
      - alacritty  # terminal emulator
      - ghostty  # terminal emulator
      - i3lock  # lock screen / screensaver
      - xorg-xsetroot  # set background image
      # --- end of i3wm ---
      - syncthing
      - rsync
      # Internet browser
      - vivaldi
      - chromium
      - brave-browser
      # Terminal
      - fish
      # Explorer
      # - thunar
      - pcmanfm  # better thunar alternative
      # Communication
      - discord
      # Remote hard drive mounting
      # sshfs remote:/remote/directory /my/local/directory
      - fuse
      - sshfs
      # Media viewer and editors
      - xournalpp
      - obsidian  # notes editor
      - libreoffice-still  # libre office
      ## Images
      - gwenview  # image viewer and simple editor
      - viewnior  # image viewer
      ## Video
      - mpv  # video player
      # System & utility tools
      - p7zip  # better zip alternative
      - pavucontrol  # audio manager, switch between earphones and speakers
      - flameshot  # screenshotting tool
      - simple-scan
      - tree  # tree view of folder structure
      - inxi  # system information
      - btop  # monitor of system resources
      - gdu  # terminal disk usage stats viewer
      - gnome-system-monitor  # task manager
      # - brasero  # dvd burner
      - gnome-disk-utility  # disk and usb stick management
      # Use the following instead of usb stick writer GUIs:
      # Find out sdX: lsblk
      # Replace sdX with usb slot
      # sudo dd if=path/to/ubuntu.iso of=/dev/sdX bs=4M status=progress && sync && sudo eject /dev/sdX
      # Basic programming and server tools
      - base-devel
      - curl
      - wget
      - cloc
      - jq  # JSON processor
      - openssh
      - sshpass  # Allow ssh/ansible to login with password
      - ansible
      - acl  # for ansible become_user (setfacl)
      - git
      - lazygit  # git gui for terminal
      - helix
      - xsel  # enables helix to use system clipboard with space+y
      # Advanced programming tools, languages
      - make  # For AUR packages
      - python-pip
      - python-uv  # python package manager like poetry and pipenv
      - prettier  # formatter for yaml, json, css, markdown
      # Helix language servers
      # Use uv packages for format / lint: pyrefly, ruff, djlint for html/jinja
      - ansible-lint
      ## bash
      - bash-language-server
      ## yaml
      - yaml-language-server
      # Media player command-line controller
      - playerctl
      # Mic audio control gui (remove background noise, improve voice quality)
      # - easyeffects
      # Noise suppresion using pipewire instead of easyeffects
      - noise-suppression-for-voice
    state: present
  become: true
- name: Install bigger packages (>10mb)
  community.general.pacman:
    name:
      # TODO Add Devbox and Nix
      - vlc
      - vlc-plugin-ffmpeg
      - gcc
      - rust
      - blender  # video editor
      # Activate via
      # sudo archlinux-java set java-21-openjdk
      - jre11-openjdk
      - jre17-openjdk
      # - jre21-openjdk
      - postgresql  # postgres shell, psql
      - dbeaver  # database gui client
      - docker
      - docker-compose
      - filezilla  # ftp file transfer
      - audacity  # audio editor
      - ffmpeg  # CLI video converter
      - gifski  # CLI gif converter
      - qbittorrent
      # - samba  # share folders in local network
      - gimp
      - krita  # gimp alternative
      - firefox
      - calibre  # epub reader
      # Communication
      - thunderbird
      - signal-desktop
      - telegram-desktop
      # Games
      - steam
      - lutris
      - wine
      # Sheet music editor
      - musescore
      # Discord fonts
      - noto-fonts-cjk
      - noto-fonts-emoji
    state: present
  become: true
- name: Create docker group
  ansible.builtin.group:
    name: docker
    state: present
  become: true
- name: Enable docker service
  ansible.builtin.systemd_service:
    name: docker.service
    enabled: true
  become: true
  when: not ansible_check_mode
- name: Create user and set default shell
  ansible.builtin.user:
    name: '{{ ansible_user_id }}'
    groups:
      - '{{ ansible_user_id }}'
      - docker
      - wheel  # sudo rights
    shell: /usr/bin/fish
    append: true
  become: true
  when: not ansible_check_mode
- name: Start syncthing service for user
  become: true
  become_user: '{{ USERNAME | default(ansible_user_id) }}'
  ansible.builtin.systemd_service:
    name: syncthing.service
    scope: user
    state: started
    daemon_reload: true
    enabled: true
  when: not ansible_check_mode

# - name: Create syncthing directories
#   file:
#     path: "{{ item }}"
#     recurse: true
#     state: directory
#   loop:
#     - "~/syncthing"
- name: Create pipewire user config directory
  become: true
  become_user: '{{ USERNAME | default(ansible_user_id) }}'
  ansible.builtin.file:
    path: ~/.config/pipewire/pipewire.conf.d
    state: directory
    mode: '0755'
- name: Copy pipewire drop-in configs
  ansible.builtin.copy:
    src: 'pipewire/{{ item }}'
    dest: '~/.config/pipewire/pipewire.conf.d/{{ item }}'
    mode: '0644'
  become: true
  become_user: '{{ USERNAME | default(ansible_user_id) }}'
  loop:
    - 99-audio-setup.conf
    - custom-latency.conf
  notify: restart pipewire
- name: Create pipewire-pulse user config directory
  ansible.builtin.file:
    path: ~/.config/pipewire/pipewire-pulse.conf.d
    state: directory
    mode: '0755'
  become: true
  become_user: '{{ USERNAME | default(ansible_user_id) }}'
- name: Copy pipewire-pulse drop-in configs
  ansible.builtin.copy:
    src: pipewire-pulse/pipewire-pulse.conf.d/99-combined-remap.conf
    dest: ~/.config/pipewire/pipewire-pulse.conf.d/99-combined-remap.conf
    mode: '0644'
  become: true
  become_user: '{{ USERNAME | default(ansible_user_id) }}'
  notify: restart pipewire
- name: Ensure local directory exists
  ansible.builtin.file:
    path: /media/burnylaptopd
    state: directory
    owner: '{{ USERNAME | default(ansible_user_id) }}'
    group: '{{ USERNAME | default(ansible_user_id) }}'
    mode: '0755'
- name: Mount burnylaptopd:/home
  ansible.posix.mount:
    name: /media/burnylaptopd
    src: burnylaptopd:/home
    fstype: fuse.sshfs
    opts: auto,reconnect
    passno: 0
    dump: 0
    state: present
  become: true
- name: Ensure local directory exists
  ansible.builtin.file:
    path: /media/prodesk
    state: directory
    owner: '{{ USERNAME | default(ansible_user_id) }}'
    group: '{{ USERNAME | default(ansible_user_id) }}'
    mode: '0755'
- name: Mount prodesk:/home
  ansible.posix.mount:
    name: /media/prodesk
    src: prodesk:/home
    fstype: fuse.sshfs
    opts: auto,reconnect
    passno: 0
    dump: 0
    state: present
  become: true

---
# Less popups and interactivity when installing AUR packages through yay
# https://unix.stackexchange.com/a/669602/673587
# yay --save --answerdiff None --answerclean None --removemake
- name: Create the `aur_builder` user
  become: true
  ansible.builtin.user:
    name: aur_builder
    create_home: yes
    group: wheel

- name: Allow the `aur_builder` user to run `sudo pacman` without a password
  become: true
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/11-install-aur_builder
    line: 'aur_builder ALL=(ALL) NOPASSWD: /usr/bin/pacman'
    create: yes
    mode: 0644
    validate: 'visudo -cf %s'

- name: Update AUR packages
  become: true
  become_user: aur_builder
  kewlfft.aur.aur:
    update_cache: true
    upgrade: true
    state: latest
- name: Install AUR packages
  become: true
  become_user: aur_builder
  kewlfft.aur.aur:
    name:
      # Browser
      - google-chrome
      - zen-browser-bin
      - opera
      # Dev
      - visual-studio-code-bin
      - ai-jail-bin
      - playwright
      - warp-terminal-bin  # Modern terminal emulator
      # Other
      - xq  # html content extractor
      - zoom
      - spotify
      - spotify-adblock
      - anydesk-bin  # remote maintenance
      - rustdesk-bin  # anydesk / teamviewer alternative
      # - docker-slim-bin  # slimify docker images by stripping them to files that are required
      # - choosenim  # nim installer
      # - nimlangserver-bin
      - jdownloader2
      # - yt-dlp-git  # Videos downloader
      - ttf-symbola  # required by discord? https://wiki.archlinux.org/title/Discord#Emojis_are_not_rendered_correctly
      - nodejs-emmet-ls  # emmet language server for helix
      # - whatsie  # Whatsapp, use web version instead https://web.whatsapp.com
      # - lazydocker-bin  # docker gui in terminal
    state: present
    update_cache: true

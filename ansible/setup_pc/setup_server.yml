---
# Execute with
# ansible-playbook setup_server.yml -i ../hosts -i /home/burny/syncthing/secrets/ansible_secrets/.ansible_secrets
- name: After a fresh manjaro installation, install or upgrade all software
  hosts: my_servers
  tasks:
    - name: Install packages
      ansible.builtin.apt:
        name:
          # Common
          - rsync
          - curl
          - ffmpeg
          - python3
          - python3-pip
          - python3-uv
          # Terminal
          - fish
          # Task manager
          - btop
          # Disk analyzer
          - gdu
          # Video downloader
          # - yt-dlp
          # Compression for backup
          - p7zip-full
        update_cache: true
        state: latest
        autoclean: true
        autoremove: true
    - name: Set default shell
      ansible.builtin.user:
        name: root
        groups:
          - root
        shell: /usr/bin/fish

    # https://www.digitalocean.com/community/tutorials/how-to-use-ansible-to-install-and-set-up-docker-on-ubuntu-20-04
    - name: Add Docker GPG apt Key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
    - name: Add Docker Repository
      ansible.builtin.apt_repository:
        repo: deb https://download.docker.com/linux/ubuntu focal stable
        state: present
    - name: Update apt and install docker-ce
      ansible.builtin.apt:
        name: docker-ce
        state: latest
        update_cache: true

    # Set up swap memory
    - name: Check if swap file exists
      ansible.builtin.stat:
        path: /swapfile
      register: swapfile_stat
    - name: Create and configure swap file (Btrfs and Ext4 compatible)
      ansible.builtin.shell: |
        touch /swapfile
        chattr +C /swapfile || true  # NoCOW only matters on Btrfs; no-op on ext4
        fallocate -l {{ swapfile_size | default('10G') }} /swapfile
        chmod 600 /swapfile
        mkswap /swapfile
      args:
        creates: /swapfile
      when: not swapfile_stat.stat.exists
      become: true
      changed_when: true
    - name: Enable swap file
      ansible.builtin.command: swapon /swapfile
      when: (ansible_facts.swaptotal_mb | default(0)) < 1
      become: true
      changed_when: true
    - name: Ensure swapfile is enabled on boot by editing /etc/fstab
      ansible.builtin.mount:
        name: swap
        src: /swapfile
        fstype: swap
        opts: defaults
        passno: 0
        dump: 0
        state: present
      become: true
    - name: Mount 480gb ssd
      ansible.posix.mount:
        path: /media/ssd480
        src: UUID=cdc98894-8eb6-4239-a639-424fa9009b9f
        fstype: ext4
        opts: noatime
        state: mounted
      become: true
      when: "'server_group1' in group_names"

      # Disable ssh login with password by modifying
      # nano /etc/ssh/sshd_config
      # Setting the following to "no"
      # PasswordAuthentication no
      # systemctl reload ssh

      # For laptops, disable lid=shutdown by editing
      # /etc/systemd/logind.conf
      # HandleLidSwitch=ignore
      # systemctl restart systemd-logind

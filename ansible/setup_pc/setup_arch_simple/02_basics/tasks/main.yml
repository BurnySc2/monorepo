---
- name: Install packages
  community.general.pacman:
    name:
      - yay
    state: present
  become: true
- name: Upgrade system
  community.general.pacman:
    update_cache: true
    upgrade: true
  become: true

# Set up swap memory
# Swap size is fixed at first creation; an existing non-empty /swapfile is never resized.
- name: Check if swap file exists
  ansible.builtin.stat:
    path: /swapfile
  register: swapfile_stat
- name: Create and configure swap file (Btrfs and Ext4 compatible)
  ansible.builtin.shell: |
    set -e
    touch /swapfile
    chattr +C /swapfile || true  # NoCOW only matters on Btrfs; no-op on ext4
    fallocate -l {{ swapfile_size | default('20G') }} /swapfile
    chmod 600 /swapfile
    mkswap /swapfile
  when: (not swapfile_stat.stat.exists) or ((swapfile_stat.stat.size | default(0)) | int == 0)
  become: true
  changed_when: true
- name: Enable swap file
  ansible.builtin.command: swapon /swapfile
  when: (ansible_facts.swaptotal_mb | default(0)) < 1
  become: true
  changed_when: true
- name: Ensure swapfile is enabled on boot by editing /etc/fstab
  ansible.builtin.mount:
    name: swap
    src: /swapfile
    fstype: swap
    opts: defaults
    passno: 0
    dump: 0
    state: present
  become: true

---
# https://www.audiobookshelf.org/
# https://www.audiobookshelf.org/docs#docker-install
# Execute with
# ansible-playbook audiobookshelf_setup.yml -i inventory -i /home/burny/syncthing/secrets/ansible_secrets/.ansible_secrets
- name: Create service [audiobookshelf]
  hosts: server_group2
  vars:
    USERNAME: "{{ audiobookshelf_username }}"
    SUBDOMAIN: "{{ audiobookshelf_subdomain }}"
    APPLICATION_PORT: "{{ audiobookshelf_port }}"
  tasks:
    - name: Include tasks [audiobookshelf]
      ansible.builtin.include_tasks: tasks/audiobookshelf/main.yml
  handlers:
    - name: Import handlers [audiobookshelf]
      ansible.builtin.import_tasks: handlers/main.yml

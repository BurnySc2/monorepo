---
- name: Assert audiobookshelf inventory variables are defined
  ansible.builtin.assert:
    that:
      - audiobookshelf_username is defined
      - audiobookshelf_subdomain is defined
      - audiobookshelf_port is defined
    fail_msg: Missing inventory/host_vars for audiobookshelf_username, audiobookshelf_subdomain, audiobookshelf_port

- name: Ensure A record exists
  ansible.builtin.include_tasks: ../../../setup_cloudflare_a_record.yml
  loop:
    - {domain: '{{ secrets.MY_PUBLIC_DOMAIN }}', subdomain: '{{ audiobookshelf_subdomain }}'}

- name: Create group
  ansible.builtin.group:
    name: '{{ audiobookshelf_username }}'
    state: present

- name: Create user
  ansible.builtin.user:
    name: '{{ audiobookshelf_username }}'
    groups:
      - '{{ audiobookshelf_username }}'
      - docker
    shell: '{{ secrets.DEFAULT_SHELL }}'

- name: Get user id
  ansible.builtin.shell:
    cmd: id {{ audiobookshelf_username }} -u
  register: USER_ID
  changed_when: false

- name: Get group id
  ansible.builtin.shell:
    cmd: id {{ audiobookshelf_username }} -g
  register: GROUP_ID
  changed_when: false

- name: Create directories
  ansible.builtin.file:
    path: '{{ item }}'
    recurse: true
    state: directory
    owner: '{{ USER_ID.stdout }}'
    group: '{{ GROUP_ID.stdout }}'
  loop:
    - /home/{{ audiobookshelf_username }}/config
    - /home/{{ audiobookshelf_username }}/metadata

- name: Template docker-compose.yml file
  ansible.builtin.template:
    src: ../../templates/docker-compose.yml.j2
    dest: /home/{{ audiobookshelf_username }}/docker-compose.yml
    owner: "{{ USER_ID.stdout }}"
    group: "{{ GROUP_ID.stdout }}"
    mode: '0640'
  notify: converge audiobookshelf

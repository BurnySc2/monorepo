---
- name: Ensure pangolin_newt network exists
  ansible.builtin.import_tasks: ../../../tasks/docker/networks.yml

- name: Assert navidrome inventory variables are defined
  ansible.builtin.assert:
    that:
      - navidrome_username is defined
      - navidrome_subdomain is defined
      - navidrome_port is defined
    fail_msg: Missing inventory/host_vars for navidrome_username, navidrome_subdomain, navidrome_port

- name: Ensure A record exists
  ansible.builtin.include_tasks: ../../../setup_cloudflare_a_record.yml
  loop:
    - {domain: '{{ secrets.MY_PUBLIC_DOMAIN }}', subdomain: '{{ navidrome_subdomain }}'}

- name: Create group
  ansible.builtin.group:
    name: '{{ navidrome_username }}'
    state: present

- name: Create user
  ansible.builtin.user:
    name: '{{ navidrome_username }}'
    groups:
      - '{{ navidrome_username }}'
      - docker
    shell: '{{ secrets.DEFAULT_SHELL }}'

- name: Get user id
  ansible.builtin.shell:
    cmd: id {{ navidrome_username }} -u
  register: USER_ID
  changed_when: false

- name: Get group id
  ansible.builtin.shell:
    cmd: id {{ navidrome_username }} -g
  register: GROUP_ID
  changed_when: false

- name: Create directories
  ansible.builtin.file:
    path: '{{ item }}'
    recurse: true
    state: directory
    owner: '{{ USER_ID.stdout }}'
    group: '{{ GROUP_ID.stdout }}'
  loop:
    - /home/{{ navidrome_username }}/data

- name: Template docker-compose.yml file
  ansible.builtin.template:
    src: ../../templates/docker-compose.yml.j2
    dest: /home/{{ navidrome_username }}/docker-compose.yml
    owner: '{{ USER_ID.stdout }}'
    group: '{{ GROUP_ID.stdout }}'
    mode: '0640'
  notify: restart navidrome

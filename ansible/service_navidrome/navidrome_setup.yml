---
# https://github.com/navidrome/navidrome
# https://www.navidrome.org/docs/installation/docker/
# https://www.navidrome.org/docs/overview/#apps
# Execute with
# ansible-playbook navidrome_setup.yml -i inventory -i /home/burny/syncthing/secrets/ansible_secrets/.ansible_secrets
- name: Create service [navidrome]
  hosts: server_group4
  vars:
    USERNAME: "{{ navidrome_username }}"
    SUBDOMAIN: "{{ navidrome_subdomain }}"
    APPLICATION_PORT: "{{ navidrome_port }}"
  tasks:
    - ansible.builtin.include_tasks: tasks/navidrome/main.yml
  handlers:
    - ansible.builtin.import_tasks: handlers/main.yml

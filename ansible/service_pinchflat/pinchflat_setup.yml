---
# https://github.com/kieraneglin/pinchflat
# Execute with
# ansible-playbook pinchflat_setup.yml -i inventory -i /home/burny/syncthing/secrets/ansible_secrets/.ansible_secrets
- name: Create service [pinchflat]
  hosts: server_group1
  vars:
    USERNAME: "{{ pinchflat_username }}"
    SUBDOMAIN: "{{ pinchflat_subdomain }}"
    APPLICATION_PORT: "{{ pinchflat_port }}"
  tasks:
    - name: Include tasks [pinchflat]
      ansible.builtin.include_tasks: tasks/pinchflat/main.yml
  handlers:
    - name: Import handlers [pinchflat]
      ansible.builtin.import_tasks: handlers/main.yml

---
- name: Assert pinchflat inventory variables are defined
  ansible.builtin.assert:
    that:
      - pinchflat_username is defined
      - pinchflat_subdomain is defined
      - pinchflat_port is defined
    fail_msg: Missing inventory/host_vars for pinchflat_username, pinchflat_subdomain, pinchflat_port

- name: Ensure A record exists
  ansible.builtin.include_tasks: ../../../setup_cloudflare_a_record.yml
  loop:
    - {domain: '{{ secrets.MY_PRIVATE_DOMAIN }}', subdomain: '{{ pinchflat_subdomain }}'}

- name: Create group
  ansible.builtin.group:
    name: '{{ pinchflat_username }}'
    state: present

- name: Create user
  ansible.builtin.user:
    name: '{{ pinchflat_username }}'
    groups:
      - '{{ pinchflat_username }}'
      - docker
    shell: '{{ secrets.DEFAULT_SHELL }}'

# WHY id syncthing fails unless syncthing user exists: run syncthing first on prodesk
- name: Get syncthing user id
  ansible.builtin.shell:
    cmd: id syncthing -u
  register: SYNCTHING_USER_ID
  changed_when: false

- name: Get syncthing group id
  ansible.builtin.shell:
    cmd: id syncthing -g
  register: SYNCTHING_GROUP_ID
  changed_when: false

- name: Get user id
  ansible.builtin.shell:
    cmd: id {{ pinchflat_username }} -u
  register: USER_ID
  changed_when: false

- name: Get group id
  ansible.builtin.shell:
    cmd: id {{ pinchflat_username }} -g
  register: GROUP_ID
  changed_when: false

- name: Create directories
  ansible.builtin.file:
    path: '{{ item }}'
    recurse: true
    state: directory
    owner: '{{ USER_ID.stdout }}'
    group: '{{ GROUP_ID.stdout }}'
  loop:
    - /home/{{ pinchflat_username }}/config
    - /media/ssd480/pinchflat/downloads

- name: Template docker-compose.yml file
  ansible.builtin.template:
    src: ../../templates/docker-compose.yml.j2
    dest: /home/{{ pinchflat_username }}/docker-compose.yml
    owner: '{{ USER_ID.stdout }}'
    group: '{{ GROUP_ID.stdout }}'
    mode: '0640'
  notify: restart pinchflat

---
# https://github.com/wolveix/satisfactory-server
# https://github.com/wolveix/satisfactory-server/wiki/Troubleshooting-FAQ
# Execute with
# ansible-playbook satisfactory_setup.yml -i inventory -i /home/burny/syncthing/secrets/ansible_secrets/.ansible_secrets
- name: Create service [satisfactory]
  hosts: prodesk
  vars:
    USERNAME: "{{ satisfactory_username }}"
    APPLICATION_PORT: "{{ satisfactory_port }}"
  tasks:
    - ansible.builtin.include_tasks: tasks/satisfactory/main.yml
  handlers:
    - ansible.builtin.import_tasks: handlers/main.yml

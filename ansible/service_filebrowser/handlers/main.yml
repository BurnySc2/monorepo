---
- name: Converge filebrowser
  listen: converge filebrowser
  community.docker.docker_compose_v2:
    project_src: "/home/{{ USERNAME }}"
    state: present
    pull: missing
- name: Restart filebrowser
  listen: restart filebrowser
  community.docker.docker_compose_v2:
    project_src: "/home/{{ USERNAME }}"
    state: restarted

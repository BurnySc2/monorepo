---
- name: Ensure pangolin_newt network exists
  ansible.builtin.import_tasks: ../../../tasks/docker/networks.yml

- name: Assert filebrowser inventory variables are defined
  ansible.builtin.assert:
    that:
      - filebrowser_username is defined
      - filebrowser_subdomain is defined
      - filebrowser_port is defined
    fail_msg: Missing inventory/host_vars for filebrowser_username, filebrowser_subdomain, filebrowser_port

- name: Ensure A record exists
  ansible.builtin.include_tasks: ../../../setup_cloudflare_a_record.yml
  loop:
    - {domain: '{{ secrets.MY_PUBLIC_DOMAIN }}', subdomain: '{{ filebrowser_subdomain }}'}

- name: Create group
  ansible.builtin.group:
    name: '{{ filebrowser_username }}'
    state: present

- name: Create user
  ansible.builtin.user:
    name: '{{ filebrowser_username }}'
    groups:
      - '{{ filebrowser_username }}'
      - docker
    shell: '{{ secrets.DEFAULT_SHELL }}'

- name: Get user id
  ansible.builtin.shell:
    cmd: id {{ filebrowser_username }} -u
  register: USER_ID
  changed_when: false

- name: Get group id
  ansible.builtin.shell:
    cmd: id {{ filebrowser_username }} -g
  register: GROUP_ID
  changed_when: false

- name: Create directories
  ansible.builtin.file:
    path: '{{ item }}'
    recurse: true
    state: directory
    owner: '{{ USER_ID.stdout }}'
    group: '{{ GROUP_ID.stdout }}'
  loop:
    - /home/{{ filebrowser_username }}/data
    - /home/{{ filebrowser_username }}/database
    - /home/{{ filebrowser_username }}/database/tmp

- name: Template config.yaml file
  ansible.builtin.template:
    src: ../../templates/config.yaml.j2
    dest: /home/{{ filebrowser_username }}/database/config.yaml
    owner: '{{ USER_ID.stdout }}'
    group: '{{ GROUP_ID.stdout }}'
    mode: '0640'
    force: true
  notify: restart filebrowser

- name: Template docker-compose.yml file
  ansible.builtin.template:
    src: ../../templates/docker-compose.yml.j2
    dest: /home/{{ filebrowser_username }}/docker-compose.yml
  notify: restart filebrowser

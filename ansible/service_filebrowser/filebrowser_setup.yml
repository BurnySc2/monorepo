---
# Execute with
# ansible-playbook filebrowser_setup.yml -i inventory -i /home/burny/syncthing/secrets/ansible_secrets/.ansible_secrets
- name: Create service [filebrowser]
  hosts: contabo2
  vars:
    USERNAME: "{{ filebrowser_username }}"
    SUBDOMAIN: "{{ filebrowser_subdomain }}"
    APPLICATION_PORT: "{{ filebrowser_port }}"
  tasks:
    - name: Include tasks [filebrowser]
      ansible.builtin.include_tasks: tasks/filebrowser/main.yml
  handlers:
    - name: Import handlers [filebrowser]
      ansible.builtin.import_tasks: handlers/main.yml

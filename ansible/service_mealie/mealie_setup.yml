---
# Execute with
# ansible-playbook mealie_setup.yml -i inventory -i /home/burny/syncthing/secrets/ansible_secrets/.ansible_secrets
- name: Create service [mealie]
  hosts: server_group2
  vars:
    USERNAME: "{{ mealie_username }}"
    SUBDOMAIN: "{{ mealie_subdomain }}"
    APPLICATION_PORT: "{{ mealie_port }}"
  tasks:
    - name: Include tasks [mealie]
      ansible.builtin.include_tasks: tasks/mealie/main.yml
  handlers:
    - name: Import handlers [mealie]
      ansible.builtin.import_tasks: handlers/main.yml

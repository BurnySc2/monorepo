---
# Execute with
# ansible-playbook syncthing_setup.yml -i inventory -i /home/burny/syncthing/secrets/ansible_secrets/.ansible_secrets
- name: Create service
  hosts: my_servers
  vars:
    USERNAME: "{{ syncthing_username }}"
    APPLICATION_PORT: "{{ syncthing_port }}"
  tasks:
    - ansible.builtin.include_tasks: tasks/syncthing/main.yml
  handlers:
    - ansible.builtin.import_tasks: handlers/main.yml

---
# Execute with
# ansible-playbook syncthing_setup.yml -i ../hosts -i /home/burny/syncthing/secrets/ansible_secrets/.ansible_secrets
- name: Create and start syncthing service
  hosts: my_servers
  vars:
    USERNAME: '{{ secrets.SYNCTHING.USERNAME }}'
    APPLICATION_PORT: '8384'
  tasks:
    - name: Create group
      ansible.builtin.group:
        name: '{{ USERNAME }}'
        state: present
    - name: Create user
      ansible.builtin.user:
        name: '{{ USERNAME }}'
        groups:
          - '{{ USERNAME }}'
          - docker
        shell: '{{ secrets.DEFAULT_SHELL }}'
    - name: Get user id
      ansible.builtin.shell:
        cmd: id {{ USERNAME }} -u
      register: USER_ID
    - name: Get group id
      ansible.builtin.shell:
        cmd: id {{ USERNAME }} -g
      register: GROUP_ID
    - name: Copy docker-compose.yml file
      template:
        src: docker-compose.yml
        dest: /home/{{ USERNAME }}/docker-compose.yml
      when: "'local_servers' in group_names"
    - name: Copy docker-compose_remote.yml file
      template:
        src: docker-compose_remote.yml
        dest: /home/{{ USERNAME }}/docker-compose.yml
      when: "'server_group4' in group_names"
    - name: Run `docker-compose up` again
      community.docker.docker_compose_v2:
        project_src: /home/{{ USERNAME }}
        pull: always

---
- name: Assert syncthing inventory variables are defined
  ansible.builtin.assert:
    that:
      - syncthing_username is defined
      - syncthing_subdomain is defined
      - syncthing_port is defined
    fail_msg: Missing inventory/host_vars for syncthing_username, syncthing_subdomain, syncthing_port

- name: Ensure A record exists
  ansible.builtin.include_tasks: ../../../setup_cloudflare_a_record.yml
  loop:
    - {domain: '{{ secrets.MY_PRIVATE_DOMAIN }}', subdomain: '{{ syncthing_subdomain }}'}

- name: Create group
  ansible.builtin.group:
    name: '{{ syncthing_username }}'
    state: present

- name: Create user
  ansible.builtin.user:
    name: '{{ syncthing_username }}'
    groups:
      - '{{ syncthing_username }}'
      - docker
    shell: '{{ secrets.DEFAULT_SHELL }}'

- name: Get user id
  ansible.builtin.command:
    cmd: id {{ syncthing_username }} -u
  register: USER_ID
  changed_when: false

- name: Get group id
  ansible.builtin.command:
    cmd: id {{ syncthing_username }} -g
  register: GROUP_ID
  changed_when: false

- name: Create directories
  ansible.builtin.file:
    path: '{{ item }}'
    recurse: true
    state: directory
    owner: '{{ USER_ID.stdout }}'
    group: '{{ GROUP_ID.stdout }}'
    mode: '0750'
  loop:
    - /home/{{ syncthing_username }}/config
    - /home/{{ syncthing_username }}/data1

- name: Template docker-compose.yml file
  ansible.builtin.template:
    src: ../../templates/docker-compose.yml.j2
    dest: /home/{{ syncthing_username }}/docker-compose.yml
    owner: '{{ USER_ID.stdout }}'
    group: '{{ GROUP_ID.stdout }}'
    mode: '0640'
  notify: converge syncthing

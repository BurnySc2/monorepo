---
networks:
  pangolin_newt:
    external: true
# Don't forget to change IP in GUI from 127.0.0.1 to 0.0.0.0 if you want to expose it to the web
services:
  syncthing:
    container_name: syncthing
    hostname: syncthing
    restart: unless-stopped
    image: syncthing/syncthing:latest
    volumes:
      - ./config:/var/syncthing/config
      - ./data1:/data1
    environment:
      - PUID={{ USER_ID.stdout }}
      - PGID={{ GROUP_ID.stdout }}
    networks:
      - pangolin_newt
    labels:
      - pangolin.public-resources.syncthing_{{ inventory_hostname }}.name=Syncthing_{{ inventory_hostname }}
      - pangolin.public-resources.syncthing_{{ inventory_hostname }}.full-domain={{ SYNCTHING_URL }}
      - pangolin.public-resources.syncthing_{{ inventory_hostname }}.protocol=http
      - pangolin.public-resources.syncthing_{{ inventory_hostname }}.auth.sso-enabled=true
      - pangolin.public-resources.syncthing_{{ inventory_hostname }}.targets[0].method=http
      - pangolin.public-resources.syncthing_{{ inventory_hostname }}.targets[0].port={{ APPLICATION_PORT }}
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 2048M

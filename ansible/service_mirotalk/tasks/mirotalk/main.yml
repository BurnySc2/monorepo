---
- name: Assert mirotalk inventory variables are defined
  ansible.builtin.assert:
    that:
      - mirotalk_username is defined
      - mirotalk_subdomain is defined
      - mirotalk_port is defined
    fail_msg: Missing inventory/host_vars for mirotalk_username, mirotalk_subdomain, mirotalk_port

- name: Ensure A record exists
  ansible.builtin.include_tasks: ../../../setup_cloudflare_a_record.yml
  loop:
    - {domain: '{{ secrets.MY_PUBLIC_DOMAIN }}', subdomain: '{{ mirotalk_subdomain }}'}

- name: Create group
  ansible.builtin.group:
    name: '{{ mirotalk_username }}'
    state: present

- name: Create user
  ansible.builtin.user:
    name: '{{ mirotalk_username }}'
    groups:
      - '{{ mirotalk_username }}'
      - docker
    shell: '{{ secrets.DEFAULT_SHELL }}'

- name: Get user id
  ansible.builtin.command:
    cmd: id {{ mirotalk_username }} -u
  register: USER_ID
  changed_when: false

- name: Get group id
  ansible.builtin.command:
    cmd: id {{ mirotalk_username }} -g
  register: GROUP_ID
  changed_when: false

- name: Create directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: '{{ USER_ID.stdout }}'
    group: '{{ GROUP_ID.stdout }}'
    mode: '0750'
  loop:
    - /home/{{ mirotalk_username }}

- name: Template mirotalk.env file
  ansible.builtin.template:
    src: ../../templates/mirotalk.env.j2
    dest: /home/{{ mirotalk_username }}/.env
    owner: '{{ USER_ID.stdout }}'
    group: '{{ GROUP_ID.stdout }}'
    mode: '0640'
  notify: restart mirotalk

- name: Template docker-compose.yml file
  ansible.builtin.template:
    src: ../../templates/docker-compose.yml.j2
    dest: /home/{{ mirotalk_username }}/docker-compose.yml
    owner: '{{ USER_ID.stdout }}'
    group: '{{ GROUP_ID.stdout }}'
    mode: '0640'
  notify: converge mirotalk

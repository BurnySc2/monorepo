---
# https://github.com/miroslavpejic85/mirotalk
# Execute with
# ansible-playbook mirotalk_setup.yml -i inventory -i /home/burny/syncthing/secrets/ansible_secrets/.ansible_secrets
- name: Create service [mirotalk]
  hosts: contabo2
  vars:
    USERNAME: "{{ mirotalk_username }}"
    SUBDOMAIN: "{{ mirotalk_subdomain }}"
    APPLICATION_PORT: "{{ mirotalk_port }}"
  tasks:
    - name: Include tasks [mirotalk]
      ansible.builtin.include_tasks: tasks/mirotalk/main.yml
  handlers:
    - name: Import handlers [mirotalk]
      ansible.builtin.import_tasks: handlers/main.yml

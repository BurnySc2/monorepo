---
# https://github.com/louislam/uptime-kuma
# Execute with
# ansible-playbook uptime_kuma_setup.yml -i inventory -i /home/burny/syncthing/secrets/ansible_secrets/.ansible_secrets
- name: Create service [uptime_kuma]
  hosts: server_group4
  vars:
    USERNAME: "{{ uptime_kuma_username }}"
    SUBDOMAIN: "{{ uptime_kuma_subdomain }}"
    APPLICATION_PORT: "{{ uptime_kuma_port }}"
  tasks:
    - ansible.builtin.include_tasks: tasks/uptime_kuma/main.yml
  handlers:
    - ansible.builtin.import_tasks: handlers/main.yml

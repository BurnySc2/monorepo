---
- name: Ensure pangolin_newt network exists
  ansible.builtin.import_tasks: ../../../tasks/docker/networks.yml

- name: Assert uptime_kuma inventory variables are defined
  ansible.builtin.assert:
    that:
      - uptime_kuma_username is defined
      - uptime_kuma_subdomain is defined
      - uptime_kuma_port is defined
    fail_msg: Missing inventory/host_vars for uptime_kuma_username, uptime_kuma_subdomain, uptime_kuma_port

- name: Ensure A record exists
  ansible.builtin.include_tasks: ../../../setup_cloudflare_a_record.yml
  loop:
    - {domain: '{{ secrets.MY_PUBLIC_DOMAIN }}', subdomain: '{{ uptime_kuma_subdomain }}'}

- name: Create group
  ansible.builtin.group:
    name: '{{ uptime_kuma_username }}'
    state: present

- name: Create user
  ansible.builtin.user:
    name: '{{ uptime_kuma_username }}'
    groups:
      - '{{ uptime_kuma_username }}'
      - docker
    shell: '{{ secrets.DEFAULT_SHELL }}'

- name: Get user id
  ansible.builtin.shell:
    cmd: id {{ uptime_kuma_username }} -u
  register: USER_ID
  changed_when: false

- name: Get group id
  ansible.builtin.shell:
    cmd: id {{ uptime_kuma_username }} -g
  register: GROUP_ID
  changed_when: false

- name: Create directories
  ansible.builtin.file:
    path: '{{ item }}'
    recurse: true
    state: directory
    owner: '{{ USER_ID.stdout }}'
    group: '{{ GROUP_ID.stdout }}'
  loop:
    - /home/{{ uptime_kuma_username }}/uptime-kuma

- name: Template docker-compose.yml file
  ansible.builtin.template:
    src: ../../templates/docker-compose.yml.j2
    dest: /home/{{ uptime_kuma_username }}/docker-compose.yml
    owner: '{{ USER_ID.stdout }}'
    group: '{{ GROUP_ID.stdout }}'
    mode: '0640'
  notify: restart uptime_kuma

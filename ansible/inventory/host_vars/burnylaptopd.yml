---
# host_vars for burnylaptopd.
# SAFE IN-REPO: service usernames, subdomains, and well-known ports. These are
# visible anyway via `id`, `docker ps`, and public DNS, so storing them here is fine.
# STAYS SECRET in $ANSIBLE_SECRETS: MY_PUBLIC_DOMAIN, CLOUDFLARE.DNS_API_TOKEN,
# server IPv4, DEFAULT_SHELL, and all passwords/tokens.
audiobookshelf_username: lissen
audiobookshelf_subdomain: lissen
audiobookshelf_port: 80
jellyfin_username: vodching
jellyfin_subdomain: vodching
jellyfin_port: 8096
syncthing_subdomain: sync2
baikal_username: baikal
baikal_subdomain: baikal
baikal_port: 80
mealie_username: mealie
mealie_subdomain: recipes
mealie_port: 9000
backup_jobs:
  - {name: baikal_config, src: "/home/baikal/config/", excludes: []}
  - {name: baikal_data, src: "/home/baikal/data/", excludes: []}
  - {name: audiobookshelf, src: "/home/lissen/config", excludes: []}
  # WHY ** prefix: match at any depth below SOURCE (e.g. config/data/metadata when SOURCE is config)
  - {name: jellyfin, src: "/home/vodching/config", excludes: ["**data/transcodes", "**data/metadata", "**cache"]}
  - {name: mealie, src: "/home/mealie/mealie-data", excludes: []}

---
# Execute with
# ansible-playbook baikal_setup.yml -i inventory -i /home/burny/syncthing/secrets/ansible_secrets/.ansible_secrets
- name: Create service [baikal]
  hosts: server_group2
  vars:
    USERNAME: "{{ baikal_username }}"
    SUBDOMAIN: "{{ baikal_subdomain }}"
    APPLICATION_PORT: "{{ baikal_port }}"
  tasks:
    - ansible.builtin.include_tasks: tasks/baikal/main.yml
  handlers:
    - ansible.builtin.import_tasks: handlers/main.yml

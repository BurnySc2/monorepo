---
# Redeploy the selected services in dependency order.
# Execute with
# ansible-playbook redeploy_selected.yml -i inventory -i /home/burny/syncthing/secrets/ansible_secrets/.ansible_secrets
# Forward extra vars if a service needs them, e.g. -e NEWT_ID=... -e NEWT_SECRET=...
# Each imported play keeps its original `hosts:`.
# Select services with tags, e.g.
# ansible-playbook redeploy_selected.yml --tags filebrowser,forgejo
# ansible-playbook redeploy_selected.yml --tags apps
# ansible-playbook redeploy_selected.yml --tags games
# ansible-playbook redeploy_selected.yml --list-tags
- name: Provision shared Docker networks
  # covers prodesk/burnylaptopd/contabo2 (bridge nets are host-local)
  hosts: my_servers
  tasks:
    - ansible.builtin.include_tasks: tasks/docker/networks.yml
      tags: [networks, always]
  tags: [networks, always]

- name: Redeploy pangolin newt first
  ansible.builtin.import_playbook: service_pangolin_newt/pangolin_newt_setup.yml
  tags:
    - newt
    - infra

- name: Redeploy pangolin
  ansible.builtin.import_playbook: service_pangolin/pangolin_setup.yml

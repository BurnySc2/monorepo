---
- name: Ensure pangolin_newt network exists
  ansible.builtin.import_tasks: ../../../tasks/docker/networks.yml

- name: Assert stirling inventory variables are defined
  ansible.builtin.assert:
    that:
      - stirling_username is defined
      - stirling_subdomain is defined
      - stirling_port is defined
    fail_msg: Missing inventory/host_vars for stirling_username, stirling_subdomain, stirling_port

- name: Ensure A record exists
  ansible.builtin.include_tasks: ../../../setup_cloudflare_a_record.yml
  loop:
    - {domain: '{{ secrets.MY_PUBLIC_DOMAIN }}', subdomain: '{{ stirling_subdomain }}'}

- name: Create group
  ansible.builtin.group:
    name: '{{ stirling_username }}'
    state: present

- name: Create user
  ansible.builtin.user:
    name: '{{ stirling_username }}'
    groups:
      - '{{ stirling_username }}'
      - docker
    shell: '{{ secrets.DEFAULT_SHELL }}'

- name: Get user id
  ansible.builtin.shell:
    cmd: id {{ stirling_username }} -u
  register: USER_ID
  changed_when: false

- name: Get group id
  ansible.builtin.shell:
    cmd: id {{ stirling_username }} -g
  register: GROUP_ID
  changed_when: false

- name: Create directories
  ansible.builtin.file:
    path: '{{ item }}'
    recurse: true
    state: directory
    owner: '{{ USER_ID.stdout }}'
    group: '{{ GROUP_ID.stdout }}'
  loop:
    - /home/{{ stirling_username }}/trainingData
    - /home/{{ stirling_username }}/extraConfigs

- name: Template docker-compose.yml file
  ansible.builtin.template:
    src: ../../templates/docker-compose.yml.j2
    dest: /home/{{ stirling_username }}/docker-compose.yml
    owner: '{{ USER_ID.stdout }}'
    group: '{{ GROUP_ID.stdout }}'
    mode: '0640'
  notify: restart stirling

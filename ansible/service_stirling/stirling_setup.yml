---
# Execute with
# ansible-playbook stirling_setup.yml -i inventory -i /home/burny/syncthing/secrets/ansible_secrets/.ansible_secrets
- name: Create service [stirling]
  hosts: server_group4
  vars:
    USERNAME: "{{ stirling_username }}"
    SUBDOMAIN: "{{ stirling_subdomain }}"
    APPLICATION_PORT: "{{ stirling_port }}"
  tasks:
    - ansible.builtin.include_tasks: tasks/stirling/main.yml
  handlers:
    - ansible.builtin.import_tasks: handlers/main.yml

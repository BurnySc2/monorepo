---
# Execute with
# ansible-playbook drawio_setup.yml -i inventory -i /home/burny/syncthing/secrets/ansible_secrets/.ansible_secrets
- name: Create service [drawio]
  hosts: server_group4
  vars:
    USERNAME: "{{ drawio_username }}"
    SUBDOMAIN: "{{ drawio_subdomain }}"
    APPLICATION_PORT: "{{ drawio_port }}"
  tasks:
    - ansible.builtin.include_tasks: tasks/drawio/main.yml
  handlers:
    - ansible.builtin.import_tasks: handlers/main.yml

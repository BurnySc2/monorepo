---
- name: Ensure pangolin_newt network exists
  ansible.builtin.import_tasks: ../../../tasks/docker/networks.yml

- name: Assert drawio inventory variables are defined
  ansible.builtin.assert:
    that:
      - drawio_username is defined
      - drawio_subdomain is defined
      - drawio_port is defined
    fail_msg: Missing inventory/host_vars for drawio_username, drawio_subdomain, drawio_port

- name: Ensure A record exists
  ansible.builtin.include_tasks: ../../../setup_cloudflare_a_record.yml
  loop:
    - {domain: '{{ secrets.MY_PUBLIC_DOMAIN }}', subdomain: '{{ drawio_subdomain }}'}

- name: Create group
  ansible.builtin.group:
    name: '{{ drawio_username }}'
    state: present

- name: Create user
  ansible.builtin.user:
    name: '{{ drawio_username }}'
    groups:
      - '{{ drawio_username }}'
      - docker
    shell: '{{ secrets.DEFAULT_SHELL }}'

- name: Get user id
  ansible.builtin.shell:
    cmd: id {{ drawio_username }} -u
  register: USER_ID
  changed_when: false

- name: Get group id
  ansible.builtin.shell:
    cmd: id {{ drawio_username }} -g
  register: GROUP_ID
  changed_when: false

- name: Create directories
  ansible.builtin.file:
    path: '{{ item }}'
    recurse: true
    state: directory
    owner: '{{ USER_ID.stdout }}'
    group: '{{ GROUP_ID.stdout }}'
  loop:
    - /home/{{ drawio_username }}/data

- name: Template docker-compose.yml file
  ansible.builtin.template:
    src: ../../templates/docker-compose.yml.j2
    dest: /home/{{ drawio_username }}/docker-compose.yml
    owner: '{{ USER_ID.stdout }}'
    group: '{{ GROUP_ID.stdout }}'
    mode: '0640'
  notify: restart drawio

---
- name: Assert forgejo inventory variables are defined
  ansible.builtin.assert:
    that:
      - forgejo_username is defined
      - forgejo_subdomain is defined
      - forgejo_port is defined
      - forgejo_ssh_port is defined
    fail_msg: Missing inventory/host_vars for forgejo_username, forgejo_subdomain, forgejo_port, forgejo_ssh_port

- name: Ensure A record exists
  ansible.builtin.include_tasks: ../../../setup_cloudflare_a_record.yml
  loop:
    - {domain: '{{ secrets.MY_PUBLIC_DOMAIN }}', subdomain: '{{ forgejo_subdomain }}'}

- name: Create group
  ansible.builtin.group:
    name: '{{ forgejo_username }}'
    state: present

- name: Create user
  ansible.builtin.user:
    name: '{{ forgejo_username }}'
    groups:
      - '{{ forgejo_username }}'
      - docker
    shell: '{{ secrets.DEFAULT_SHELL }}'

- name: Get user id
  ansible.builtin.command:
    cmd: id {{ forgejo_username }} -u
  register: USER_ID
  changed_when: false

- name: Get group id
  ansible.builtin.command:
    cmd: id {{ forgejo_username }} -g
  register: GROUP_ID
  changed_when: false

- name: Create directories
  ansible.builtin.file:
    path: '{{ item }}'
    recurse: true
    state: directory
    owner: '{{ USER_ID.stdout }}'
    group: '{{ GROUP_ID.stdout }}'
    mode: '0750'
  loop:
    - /home/{{ forgejo_username }}/forgejo

- name: Template docker-compose.yml file
  ansible.builtin.template:
    src: ../../templates/docker-compose.yml.j2
    dest: /home/{{ forgejo_username }}/docker-compose.yml
    owner: '{{ USER_ID.stdout }}'
    group: '{{ GROUP_ID.stdout }}'
    mode: '0640'
  notify: converge forgejo

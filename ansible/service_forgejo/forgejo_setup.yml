---
# Execute with
# ansible-playbook forgejo_setup.yml -i inventory -i /home/burny/syncthing/secrets/ansible_secrets/.ansible_secrets
- name: Create service [forgejo]
  hosts: server_group4
  vars:
    USERNAME: "{{ forgejo_username }}"
    SUBDOMAIN: "{{ forgejo_subdomain }}"
    APPLICATION_PORT: "{{ forgejo_port }}"
    SSH_PORT: "{{ forgejo_ssh_port }}"
  tasks:
    - ansible.builtin.include_tasks: tasks/forgejo/main.yml
  handlers:
    - ansible.builtin.import_tasks: handlers/main.yml

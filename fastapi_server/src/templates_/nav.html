<nav class="flex justify-between items-center bg-white shadow-sm px-4 py-2">
    <div class="flex grow justify-center gap-4">
        <a class="flex items-center gap-2 rounded-lg px-4 py-2 hover:bg-blue-100 hover:text-blue-800 transition-colors duration-200"
            href="/tts">
            TTS
        </a>
        <a class="flex items-center gap-2 rounded-lg px-4 py-2 hover:bg-blue-100 hover:text-blue-800 transition-colors duration-200"
            href="/audiobook">
            Audiobook-Converter
        </a>
        <a class="flex items-center gap-2 rounded-lg px-4 py-2 hover:bg-blue-100 hover:text-blue-800 transition-colors duration-200"
            href="/telegram-browser">
            Telegram-Browser
        </a>
    </div>
    <a hx-get="/login/name" hx-trigger="load" hx-indicator="#spinner_login" href="/login"
        class="flex items-center gap-2 rounded-lg px-4 py-2 hover:bg-blue-100 hover:text-blue-800 transition-colors duration-200">
        <img id="spinner_login" class="htmx-indicator w-5 h-5 animate-spin" src="/static/spinner.svg" />
        Login
    </a>
</nav>
{# Script adds active styling if we are on this path #}
<script>
    const currentPath = window.location.pathname;
    const navLinks = document.querySelectorAll('nav a');
    navLinks.forEach(link => {
        if (link.getAttribute('href') === currentPath) {
            link.classList.add('bg-blue-100', 'text-blue-800', 'font-medium');
        }
    });
</script>

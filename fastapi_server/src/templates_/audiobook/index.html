{% include "header.html" with context %}
<body class="flex h-screen flex-col bg-gray-100">
    {% include "nav.html" with context %}
    <main class="flex flex-col items-center justify-center grow p-4">
        <div class="w-full p-8 bg-white rounded-xl shadow-md flex flex-col items-center gap-4">
            <h1 class="text-2xl font-bold text-center mb-6">Audiobook Manager</h1>
            <div class="flex flex-col items-center gap-4">
                <a class="px-6 py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors text-center"
                   href="/audiobook/epub_upload">Upload EPUB</a>
                {#
                <!-- <a class="w-full px-6 py-3 bg-gray-200 text-gray-800 font-medium rounded-lg hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 transition-colors text-center"
                   href="/audiobook/pdf_upload">Upload PDF</a> -->
                <!-- <a class="w-full px-6 py-3 bg-gray-200 text-gray-800 font-medium rounded-lg hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 transition-colors text-center"
                   href="/audiobook/website">Generate Audio for Website</a> -->
                #}
            </div>
            <div id="spinner" class="htmx-indicator flex flex-col items-center gap-2 mt-6">
                <div class="flex items-center gap-2">
                    <img class="htmx-spinner w-8 h-8 animate-spin" src="/static/spinner.svg" alt="Loading indicator" />
                    <span class="text-lg font-medium">Loading books...</span>
                </div>
            </div>
            <div class="m-4 htmx-indicator"
                 hx-get="/audiobook/list_books"
                 hx-trigger="load"
                 hx-swap="outerHTML"
                 hx-indicator="#spinner">
                You are not logged in.
            </div>
        </div>
    </main>
</body>

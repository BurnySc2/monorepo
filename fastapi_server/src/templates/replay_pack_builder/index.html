<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SC2 Replay Parser</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/typescript/5.5.4/typescript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/spark-md5/3.0.2/spark-md5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>

<body class="bg-gray-50 min-h-screen p-4">
    <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-md p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Upload SC2 Replays</h1>

        <div class="space-y-4">
            <div>
                <label for="replays" class="block text-sm font-medium text-gray-700 mb-1">
                    Select Replays (.SC2Replay)
                </label>
                <input type="file" id="replays" name="replays" multiple accept=".SC2Replay" class="block w-full text-sm text-gray-500
                        file:mr-4 file:py-2 file:px-4
                        file:rounded-md file:border-0
                        file:text-sm file:font-semibold
                        file:bg-blue-50 file:text-blue-700
                        hover:file:bg-blue-100">
            </div>

            <div id="drop-zone"
                class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center transition-colors duration-200 hover:border-blue-400 hover:bg-blue-50">
                <p class="text-gray-500">Or drag & drop replay files here</p>
                <p class="text-xs text-gray-400 mt-2">Supports multiple files</p>
            </div>

            <div>
                <label for="game_type" class="block text-sm font-medium text-gray-700 mb-1">
                    Game Type Filter (e.g., 1v1)
                </label>
                <input type="text" id="game_type" name="game_type"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
            </div>

            <div>
                <label for="min_length" class="block text-sm font-medium text-gray-700 mb-1">
                    Minimum Game Length (seconds)
                </label>
                <input type="number" id="min_length" name="min_length" value="0"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
            </div>

            <div>
                <label for="name_template" class="block text-sm font-medium text-gray-700 mb-1">
                    Name Template
                </label>
                <input type="text" id="name_template" name="name_template" value="{date}_{map}_{p1}_vs_{p2}"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                <p class="mt-1 text-xs text-gray-500">
                    Available tags: {date}, {map}, {p1}, {p2}
                </p>
            </div>

            <button onclick="download_files_as_zip()"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md transition-colors duration-200">
                Process Replays
            </button>
        </div>
    </div>
    <script>
        async function loadAndRunTypeScript() {
            try {
                // Fetch the TypeScript file
                const response = await fetch('/static/replay-pack-builder/index.ts');
                if (!response.ok) throw new Error(`Failed to fetch TypeScript file: ${response.statusText}`);
                const tsCode = await response.text();

                // Transpile TypeScript to JavaScript using the TypeScript compiler from CDN
                const jsCode = window.ts.transpile(tsCode, {
                    module: window.ts.ModuleKind.ESNext,
                    target: window.ts.ScriptTarget.ESNext
                });

                // Execute the transpiled JavaScript
                const script = document.createElement('script');
                script.textContent = jsCode;
                document.body.appendChild(script);
            } catch (error) {
                console.error('Error loading or running TypeScript:', error);
            }
        }

        window.onload = loadAndRunTypeScript;
    </script>
</body>

</html>

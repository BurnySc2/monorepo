---
# Execute with
# yamllint disable-line rule:line-length
# ansible-playbook deploy_playbook.yml -i ../ansible/hosts -i /home/burny/syncthing/secrets/ansible_secrets/.ansible_secrets
# yamllint enable rule:line-length
- name: Create service
  hosts: prodesk
  vars:
    USERNAME: fastapi_server
  tasks:
    - name: Create group
      ansible.builtin.group:
        name: "{{ USERNAME }}"
        state: present

    - name: Create user
      ansible.builtin.user:
        name: "{{ USERNAME }}"
        groups:
          - "{{ USERNAME }}"
          - docker
        shell: "/bin/fish"

    - name: Copy docker-compose.yml file
      ansible.builtin.template:
        src: docker-compose.yml
        dest: /home/{{ USERNAME }}/docker-compose.yml

    - name: Copy .env file
      ansible.builtin.template:
        src: .env.server
        dest: /home/{{ USERNAME }}/.env

    - name: Ensure destination directory exists
      ansible.builtin.file:
        path: /home/{{ USERNAME }}/dockerfiles
        state: directory
        mode: "0755"

    - name: Copy files except .env to the destination directory
      ansible.posix.synchronize:
        src: "./"
        dest: /home/{{ USERNAME }}/dockerfiles/
        rsync_opts:
          - --filter=':- .gitignore'
          - --exclude=.env*
          - --exclude=.git
          - --exclude=.vscode
          - --exclude=test

    - name: Build the Docker image
      community.docker.docker_image:
        name: burnysc2/fastapi_server:latest_dev
        state: present
        build:
          path: /home/{{ USERNAME }}/dockerfiles
        source: build
        # Force building even if image already exists
        force_source: true

    - name: Delete all build-files
      ansible.builtin.file:
        path: /home/{{ USERNAME }}/dockerfiles
        state: absent

    - name: Run `docker-compose up` again
      community.docker.docker_compose_v2:
        project_src: /home/{{ USERNAME }}
        profiles:
          - prod
        state: present
        recreate: always
        remove_orphans: true
        state: present
        recreate: always

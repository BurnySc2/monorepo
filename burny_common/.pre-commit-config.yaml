---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-yaml
      - id: check-toml
      - id: trailing-whitespace

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py310-plus]
        types: [python]
        files: "^burny_common/.+$"

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff-check
        name: Change single to double quotes
        args: [--select, Q, --fix]
        types: [python]
        files: "^burny_common/.+$"

      - id: ruff-check
        name: Remove unused imports
        args: [--select, F, --fix]
        types: [python]
        files: "^burny_common/.+$"

      - id: ruff-check
        name: Sort imports
        args: [--select, I, --fix]
        types: [python]
        files: "^burny_common/.+$"

      - id: ruff-format
        types: [python]
        files: "^burny_common/.+$"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: Autoformat yaml files
        args: [--write]
        files: "^burny_common/.+$"
        types: [yaml]

  - repo: local
    hooks:
      - id: pyrefly
        name: Pyrefly check
        entry: uv run --directory burny_common pyrefly check
        language: system
        types: [python]
        pass_filenames: false

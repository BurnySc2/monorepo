name: Run Python Examples

on:
  push:
    paths:
      - python_examples/**
      - .github/workflows/python_examples.yml
  pull_request:
    branches:
      - master
      - develop

env:
  SUBDIRECTORY: python_examples

jobs:
  run_pre_commit_checks:
    name: pre_commit_check_py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: ${{ env.SUBDIRECTORY }}
        run: uv sync --frozen --no-cache --no-install-project

      - name: Run pre-commit hooks
        working-directory: ${{ env.SUBDIRECTORY }}
        run: uv run pre-commit run --all-files --hook-stage push

  run_code_check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Start MongoDB
        uses: ankane/setup-mongodb@v1

      - name: Start Postgres
        uses: ankane/setup-postgres@v1
        with:
          postgres-version: 14

      # https://earthly.dev/get-earthly
      - name: Install Earthly
        run: sudo /bin/sh -c 'wget https://github.com/earthly/earthly/releases/latest/download/earthly-linux-amd64 -O /usr/local/bin/earthly && chmod +x /usr/local/bin/earthly && /usr/local/bin/earthly bootstrap --with-autocomplete'

      - name: Install
        working-directory: ${{ env.SUBDIRECTORY }}
        run: earthly +install-dev --verbose true --PYTHONVERSION=${{ matrix.python-version }}

      - name: Run code checks and tests
        working-directory: ${{ env.SUBDIRECTORY }}
        run: earthly +all --verbose true --PYTHONVERSION=${{ matrix.python-version }}

  #    - name: Save cache
  #      working-directory: ${{ env.SUBDIRECTORY }}
  #      run: earthly +export-cache --verbose true --PYTHONVERSION=${{ matrix.python-version }}

  run_python_examples:
    needs: [run_code_check]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"
          # Doesn't work on windows
          # - os: windows-latest
          #   python-version: "3.11"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv --no-cache-dir

      - name: Start MongoDB
        uses: ankane/setup-mongodb@v1
      #      with:
      #        mongodb-version: 5.0

      #    - name: Start MongoDB in docker
      #      if: ${{ matrix.os != 'macos-latest'}}
      #      run: |
      #        docker run --rm -d -p 27017-27019:27017-27019 --name mongodb mongo:5.0

      - name: Start Postgres
        uses: ankane/setup-postgres@v1
        with:
          postgres-version: 14

      #    - name: Start Postgres in docker
      #      if: ${{ matrix.os == 'ubuntu-latest'}}
      #      run: |
      #        docker run --rm -d --name postgresql-container -p 5432:5432 \
      #          -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=changeme postgres:9.6.23-alpine3.14

      - name: Print environment variables (linux)
        run: |
          printenv

      - name: Install Python dependencies
        working-directory: ${{ env.SUBDIRECTORY }}
        run: uv sync

      - name: Run Python tests
        working-directory: ${{ env.SUBDIRECTORY }}
        run: uv run python -m pytest

      - name: Run main.py
        working-directory: ${{ env.SUBDIRECTORY }}
        run: uv run python src/main.py

      - name: Run database readme example - peewee
        working-directory: ${{ env.SUBDIRECTORY }}
        run: uv run python src/examples/databases/readme_peewee_example.py

      - name: Run database readme example - sqlalchemy
        working-directory: ${{ env.SUBDIRECTORY }}
        run: uv run python src/examples/databases/readme_sqlalchemy_example.py

      - name: Run database readme example - sqlite
        working-directory: ${{ env.SUBDIRECTORY }}
        run: uv run python src/examples/databases/readme_sqlite_example.py

      - name: Run database readme example - tinydb
        working-directory: ${{ env.SUBDIRECTORY }}
        run: uv run python src/examples/databases/readme_tinydb_example.py

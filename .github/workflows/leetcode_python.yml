name: Test Leetcode Python

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - problem_sites/leetcode/python/**
      - .github/workflows/leetcode_python.yml
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

env:
  SUBDIRECTORY: problem_sites/leetcode/python

jobs:
  run_pre_commit_checks:
    name: pre_commit_check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: ${{ env.SUBDIRECTORY }}
        run: uv sync --frozen --no-cache --no-install-project

      - name: Run ruff check
        working-directory: ${{ env.SUBDIRECTORY }}
        run: uv run ruff check .

      - name: Run ruff format check
        working-directory: ${{ env.SUBDIRECTORY }}
        run: uv run ruff format --check .

      - name: Run pyrefly check
        working-directory: ${{ env.SUBDIRECTORY }}
        run: uv run pyrefly check

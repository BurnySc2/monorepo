name: Test Leetcode Python

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - problem_sites/leetcode/python/**
      - .github/workflows/leetcode_python.yml
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

env:
  SUBDIRECTORY: problem_sites/leetcode/python

jobs:
  run_lint_checks:
    name: lint_check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ${{ env.SUBDIRECTORY }}
        run: uv sync --frozen --no-cache --no-install-project

      - name: Run lint
        working-directory: ${{ env.SUBDIRECTORY }}
        env:
          LINT_STRICT: 1
        run: bash lint.sh

name: Test Fastapi Server

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - fastapi_server/**
      - .github/workflows/fastapi_server.yml
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

env:
  SUBDIRECTORY: fastapi_server

jobs:
  run_pre_commit_checks:
    name: pre_commit_check_py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: ${{ env.SUBDIRECTORY }}
        run: uv sync --frozen --no-cache --no-install-project

      - name: Run ruff check
        working-directory: ${{ env.SUBDIRECTORY }}
        run: uv run ruff check .

      - name: Run ruff format check
        working-directory: ${{ env.SUBDIRECTORY }}
        run: uv run ruff format --check .

      - name: Run pyrefly check
        working-directory: ${{ env.SUBDIRECTORY }}
        run: uv run pyrefly check

  test_backend:
    name: test_backend_py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up postgres and minio test instances
        working-directory: ${{ env.SUBDIRECTORY }}
        run: docker compose --profile test up -d

      - name: Install espeak-ng and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install packages
        working-directory: ${{ env.SUBDIRECTORY }}
        run: uv sync --frozen --no-cache --no-install-project

      - name: Run pytest
        working-directory: ${{ env.SUBDIRECTORY }}
        run: uv run pytest test --random-order

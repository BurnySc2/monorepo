name: Test Fastapi Server

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - fastapi_server/**
      - .github/workflows/fastapi_server.yml
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

env:
  SUBDIRECTORY: fastapi_server
  FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n8.1.3-9-g29e619e767-linux64-gpl-8.1.tar.xz  # yamllint disable-line rule:line-length
  FFMPEG_SHA256: 97ce978979194b5cf7e06a5e68020dbdaa7a4f3294c5452b6a1bc347100dbb79

jobs:
  run_lint_checks:
    name: lint_check_py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: ${{ env.SUBDIRECTORY }}
        run: uv sync --frozen --no-install-project

      - name: Run lint
        working-directory: ${{ env.SUBDIRECTORY }}
        env:
          LINT_STRICT: 1
        run: bash lint.sh

  test_backend:
    name: test_backend_py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up postgres and minio test instances
        working-directory: ${{ env.SUBDIRECTORY }}
        run: docker compose --profile test up -d

      - name: Install espeak-ng
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends espeak-ng espeak-ng-data

      - name: Restore cached static ffmpeg
        uses: actions/cache@v5.1.0
        with:
          path: |
            /tmp/ffmpeg-static
            /tmp/ffmpeg.tar.xz
          key: ffmpeg-${{ env.FFMPEG_SHA256 }}

      - name: Install static ffmpeg
        run: |
          set -euo pipefail
          mkdir -p /tmp/ffmpeg-static
          if [ ! -f /tmp/ffmpeg.tar.xz ]; then
            curl -fsSL --retry 3 -o /tmp/ffmpeg.tar.xz "$FFMPEG_URL"
          fi
          echo "$FFMPEG_SHA256  /tmp/ffmpeg.tar.xz" | sha256sum -c -
          rm -rf /tmp/ffmpeg-extract && mkdir -p /tmp/ffmpeg-extract
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-extract
          cp "$(find /tmp/ffmpeg-extract -path '*/bin/ffmpeg' -type f | head -n 1)" /tmp/ffmpeg-static/ffmpeg
          cp "$(find /tmp/ffmpeg-extract -path '*/bin/ffprobe' -type f | head -n 1)" /tmp/ffmpeg-static/ffprobe
          rm -rf /tmp/ffmpeg-extract
          sudo install -m 0755 /tmp/ffmpeg-static/ffmpeg /tmp/ffmpeg-static/ffprobe /usr/local/bin/
          ffmpeg -version
          ffprobe -version

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install packages
        working-directory: ${{ env.SUBDIRECTORY }}
        run: uv sync --frozen --no-install-project

      - name: Run pytest
        working-directory: ${{ env.SUBDIRECTORY }}
        # REQUIRE_DB=1: missing-postgres skips fail here;
        # services are up. Without services use -m "not db".
        env:
          REQUIRE_DB: 1
        run: uv run pytest test --random-order

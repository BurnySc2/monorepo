name: Test Stream Announcer

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - twitch_stream_announcer/**
      - .github/workflows/stream_announcer.yml
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

env:
  SUBDIRECTORY: twitch_stream_announcer
  DOCKER_IMAGE_NAME: burnysc2/twitch_stream_announcer
  DOCKER_IMAGE_VERSION: 1.0.0

jobs:
  test_stream_announcer:
    name: test_stream_announcer_nim-${{ matrix.nim-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        nim-version: ["2.2.0"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim-version }}

      - name: Install dependencies
        working-directory: ${{ env.SUBDIRECTORY }}
        run: nimble install --depsOnly -y

      - name: Compile
        working-directory: ${{ env.SUBDIRECTORY }}
        run: nimble c -d:ssl -d:release --opt:size -o:main src/main.nim

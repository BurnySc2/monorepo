name: Test Svelte Frontends

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - svelte_frontends/**
      - fastapi_server/**
      - .github/workflows/svelte_frontends.yml
  pull_request:
    branches: [master, develop]
    paths:
      - svelte_frontends/**
      - fastapi_server/**
      - .github/workflows/svelte_frontends.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: svelte_frontends/package-lock.json

      - name: Install dependencies
        working-directory: svelte_frontends
        run: npm ci

      - name: Build
        if: always()
        working-directory: svelte_frontends
        run: npm run build

      - name: Lint
        if: always()
        working-directory: svelte_frontends
        run: npm run lint

      - name: Type check
        if: always()
        working-directory: svelte_frontends
        run: npm run check

      - name: Check types
        if: always()
        working-directory: svelte_frontends
        run: npm run check-types

      - name: Run unit unit tests
        if: always()
        working-directory: svelte_frontends
        run: npm run test:unit

      - name: Run unit integration tests
        if: always()
        working-directory: svelte_frontends
        run: npm run test:integration

      - name: Report results
        if: always()
        run: |
          echo "## Workflow completed (see individual step statuses)" >> $GITHUB_STEP_SUMMARY

name: Test Svelte Frontends

on:
  push:
    paths:
      - svelte_frontends/**
      - .github/workflows/svelte_frontends.yml
  pull_request:
    branches: [master, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: svelte_frontends/package-lock.json

      - name: Install dependencies
        working-directory: svelte_frontends
        run: npm ci

      - name: Build
        working-directory: svelte_frontends
        run: npm run build

      - name: Run unit tests
        working-directory: svelte_frontends
        run: npm run test:unit

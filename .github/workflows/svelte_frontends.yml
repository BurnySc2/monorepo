name: Test Svelte Frontends

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master, develop]
    paths:
      - svelte_frontends/**
      - fastapi_server/**
      - .github/workflows/svelte_frontends.yml
  pull_request:
    branches: [master, develop]
    paths:
      - svelte_frontends/**
      - fastapi_server/**
      - .github/workflows/svelte_frontends.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24, 26]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: svelte_frontends/package-lock.json

      - name: Install dependencies
        working-directory: svelte_frontends
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.61.0-${{
            hashFiles('svelte_frontends/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-1.61.0-
            ${{ runner.os }}-playwright-

      - name: Install Playwright chromium
        working-directory: svelte_frontends
        run: npx playwright install chromium --with-deps

      - name: Lint
        if: always()
        working-directory: svelte_frontends
        run: npm run lint

      - name: Build
        if: always()
        working-directory: svelte_frontends
        run: npm run build

      - name: Check types
        if: always()
        working-directory: svelte_frontends
        run: npm run check-types

      - name: Type check
        if: always()
        working-directory: svelte_frontends
        run: npm run check

      - name: Run unit tests
        if: always()
        working-directory: svelte_frontends
        run: npm run test:unit

      - name: Run integration tests
        if: always()
        working-directory: svelte_frontends
        run: npm run test:integration

      - name: Report results
        if: always()
        run: |
          echo "## Workflow completed" >> "$GITHUB_STEP_SUMMARY"
          echo "(see individual step statuses)" >> "$GITHUB_STEP_SUMMARY"

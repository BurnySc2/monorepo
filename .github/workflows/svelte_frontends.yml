name: Test Svelte Frontends

on:
  push:
    paths:
      - svelte_frontends/**
      - .github/workflows/svelte_frontends.yml
  pull_request:
    branches: [master, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: svelte_frontends/package-lock.json

      - name: Install dependencies
        working-directory: svelte_frontends
        run: npm ci

      - name: Build
        working-directory: svelte_frontends
        run: npm run build || echo "❌ Build failed" >> $GITHUB_STEP_SUMMARY

      - name: Lint
        working-directory: svelte_frontends
        run: npm run lint || echo "❌ Lint failed" >> $GITHUB_STEP_SUMMARY

      - name: Type check
        working-directory: svelte_frontends
        run: npm run check || echo "❌ Type check failed" >> $GITHUB_STEP_SUMMARY

      - name: Run unit unit tests
        working-directory: svelte_frontends
        run: npm run test:unit || echo "❌ Unit tests failed" >> $GITHUB_STEP_SUMMARY

      - name: Run unit integration tests
        working-directory: svelte_frontends
        run: npm run test:integration || echo "❌ Integration tests failed" >> $GITHUB_STEP_SUMMARY

      - name: Report results
        run: |
          if grep -q "❌" $GITHUB_STEP_SUMMARY; then
            echo "## ❌ Some steps failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "## ✅ All checks passed" >> $GITHUB_STEP_SUMMARY
          fi

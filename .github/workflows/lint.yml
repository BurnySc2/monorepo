name: Lint Workflows

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - .github/workflows/**
      - .yamllint.yml
      - lint.sh
      - '**/lint.sh'
      - ansible/check.sh
      - problem_sites/leetcode/python/**
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error

  yamllint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Run yamllint
        run: uvx yamllint .github/workflows/

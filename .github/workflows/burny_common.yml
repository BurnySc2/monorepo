name: Publish burny_common package

on:
  push:
    paths:
      - burny_common/**
      - .github/workflows/burny_common.yml
  pull_request:
    branches: [master, develop]

env:
  SUBDIRECTORY: burny_common

jobs:
  run_pre_commit_checks:
    name: pre_commit_check_py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: ${{ env.SUBDIRECTORY }}
        run: uv sync --frozen --no-cache --no-install-project

      - name: Run pre-commit hooks
        working-directory: ${{ env.SUBDIRECTORY }}
        run: uv run pre-commit run --all-files --hook-stage push

  run_code_check:
    name: run_code_check_py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install packages
        working-directory: ${{ env.SUBDIRECTORY }}
        run: uv sync --frozen --no-cache --no-install-project

      - name: Run pytest
        working-directory: ${{ env.SUBDIRECTORY }}
        run: uv run pytest

  build_and_publish:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install packages
        working-directory: ${{ env.SUBDIRECTORY }}
        run: uv sync --frozen --no-cache --no-install-project

      - name: Build project
        working-directory: ${{ env.SUBDIRECTORY }}
        run: uv build

      - id: wait-for-jobs
        uses: yogeshlonkar/wait-for-jobs@v0
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          jobs: |
            run_code_check_py3.9
            run_code_check_py3.10
            run_code_check_py3.11
            run_code_check_py3.12

        # Publish package on pypi
      - name: Publish
        if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
        working-directory: ${{ env.SUBDIRECTORY }}
        continue-on-error: true
        run: uv publish --token ${{ secrets.pypi_burny_common_token }}

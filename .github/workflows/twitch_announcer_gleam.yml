name: Test Twitch Announcer Gleam

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - twitch_announcer_gleam/**
      - .github/workflows/twitch_announcer_gleam.yml
  pull_request:
    paths:
      - twitch_announcer_gleam/**
      - .github/workflows/twitch_announcer_gleam.yml
  workflow_dispatch:

env:
  SUBDIRECTORY: twitch_announcer_gleam

jobs:
  test_twitch_announcer_gleam:
    name: test_twitch_announcer_gleam
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v6

      - name: Setup Erlang and Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.19.2"

      - name: Download dependencies
        working-directory: ${{ env.SUBDIRECTORY }}
        run: gleam deps download

      - name: Build
        working-directory: ${{ env.SUBDIRECTORY }}
        run: gleam build

      - name: Check
        working-directory: ${{ env.SUBDIRECTORY }}
        run: gleam check

      - name: Check formatting
        working-directory: ${{ env.SUBDIRECTORY }}
        run: gleam format --check src test

      - name: Run tests
        working-directory: ${{ env.SUBDIRECTORY }}
        run: gleam test

      - name: Live Postgres decoder smoke
        run: |
          pg_isready -h localhost -p 5432
          psql -h localhost -U postgres -d postgres -c "CREATE TABLE IF NOT EXISTS gleam_smoke (id serial PRIMARY KEY, name text NOT NULL);"
          psql -h localhost -U postgres -d postgres -c "INSERT INTO gleam_smoke (name) VALUES ('smoke') RETURNING id, name;"
          psql -h localhost -U postgres -d postgres -c "CREATE TABLE IF NOT EXISTS stream_announcer_streams (id serial PRIMARY KEY, twitch_name text NOT NULL, discord_webhook text NOT NULL, announce_message text NOT NULL, announced_at timestamptz, status text NOT NULL, last_seen_online timestamptz, enabled boolean NOT NULL DEFAULT TRUE);"
          psql -h localhost -U postgres -d postgres -c "DELETE FROM stream_announcer_streams WHERE twitch_name IN ('c3_smoke_alice', 'c3_smoke_disabled');"
          psql -h localhost -U postgres -d postgres -c "INSERT INTO stream_announcer_streams (twitch_name, discord_webhook, announce_message, announced_at, status, last_seen_online, enabled) VALUES ('c3_smoke_alice', 'https://example.invalid/c3', '@here alice live', NULL, 'offline', NULL, TRUE), ('c3_smoke_disabled', 'https://example.invalid/c3', '@here bob live', NULL, 'offline', NULL, FALSE);"

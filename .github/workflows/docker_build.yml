name: Docker Build (smoke)

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - fastapi_server/**
      - discord_bot/**
      - twitch_stream_announcer/**
      - transcribe_website/transcriber_backend/**
      - .github/workflows/docker_build.yml
  pull_request:
    branches: [master, develop]
    paths:
      - fastapi_server/**
      - discord_bot/**
      - twitch_stream_announcer/**
      - transcribe_website/transcriber_backend/**
      - .github/workflows/docker_build.yml
      # NOTE: burny_common/** intentionally excluded
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        docker-dir:
          - fastapi_server
          - discord_bot
          - twitch_stream_announcer
          - transcribe_website/transcriber_backend
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.docker-dir }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.docker-dir }}
          file: ${{ matrix.docker-dir }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.docker-dir }}
          cache-to: type=gha,mode=max,scope=${{ matrix.docker-dir }}

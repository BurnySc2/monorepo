# Validate with: docker compose -f twitch_announcer_gleam/docker-compose.yml config --no-interpolate
# Run from the twitch_announcer_gleam/ directory so .env resolves.
services:
  twitch_announcer_gleam:
    image: burnysc2/twitch_announcer_gleam:latest
    pull_policy: never
    restart: unless-stopped
    env_file:
      - .env

---
# Run as root (user/group creation + writes under /home/<user> need root):
# ansible-playbook deploy_playbook.yml -i ../ansible/hosts
# Local .env.server must exist with STAGE=PROD.
- name: Create service
  hosts: contabo2
  vars:
    USERNAME: twitch_announcer_gleam
  tasks:
    - name: Create group
      ansible.builtin.group:
        name: "{{ USERNAME }}"
        state: present

    - name: Create user
      ansible.builtin.user:
        name: "{{ USERNAME }}"
        groups:
          - "{{ USERNAME }}"
          - docker
        shell: /bin/bash

    - name: Copy docker-compose.yml file
      ansible.builtin.copy:
        src: docker-compose.yml
        dest: /home/{{ USERNAME }}/docker-compose.yml
        owner: "{{ USERNAME }}"
        group: "{{ USERNAME }}"
        mode: "0644"

    - name: Copy .env file
      ansible.builtin.copy:
        src: .env.server
        dest: /home/{{ USERNAME }}/.env
        owner: "{{ USERNAME }}"
        group: "{{ USERNAME }}"
        mode: "0600"

    - name: Ensure destination directory exists
      ansible.builtin.file:
        path: /home/{{ USERNAME }}/dockerfiles
        state: directory
        mode: "0755"

    - name: Copy files except .env to the destination directory
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/"
        dest: /home/{{ USERNAME }}/dockerfiles/
        rsync_opts:
          - --filter=':- .gitignore'
          - --exclude=.env*
          - --exclude=.git
          - --exclude=build/

    - name: Check STAGE is PROD in local .env.server
      ansible.builtin.command: grep -q '^STAGE=PROD$' .env.server
      args:
        chdir: "{{ playbook_dir }}"
      delegate_to: localhost
      run_once: true
      become: false
      register: stage_check
      changed_when: false
      failed_when: false

    - name: Enforce STAGE is PROD
      ansible.builtin.assert:
        that:
          - stage_check.rc == 0
        fail_msg: STAGE must be PROD
      delegate_to: localhost
      run_once: true
      become: false

    - name: Build the Docker image
      community.docker.docker_image:
        name: burnysc2/twitch_announcer_gleam:latest
        source: build
        force_source: true
        build:
          path: /home/{{ USERNAME }}/dockerfiles
          nocache: true
          pull: true

    - name: Delete all build-files
      ansible.builtin.file:
        path: /home/{{ USERNAME }}/dockerfiles
        state: absent

    - name: Run `docker-compose up` again
      community.docker.docker_compose_v2:
        project_src: /home/{{ USERNAME }}
        state: present
        recreate: always
